<rect x="10.0" y="91.0" width="160" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="90.0" y="107.5">1. Create an offer</tspan><tspan x="90.0" y="122.5">on an eligible listing</tspan></text>
<rect x="395.0" y="83.5" width="250" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="100.0">2. Validate eligibility and</tspan><tspan x="520" y="115.0">terms; reserve the listing</tspan><tspan x="520" y="130.0">quantity</tspan></text>
<rect x="187.5" y="161.0" width="165" height="78.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="177.5">3. Review or revise</tspan><tspan x="270.0" y="192.5">the terms (either</tspan><tspan x="270.0" y="207.5">party, before the</tspan><tspan x="270.0" y="222.5">first signature)</tspan></text>
<polygon points="270.0,260.0 285.0,275 270.0,290.0 255.0,275" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="187.5" y="308.5" width="165" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="325.0">4. Withdraw the offer</tspan><tspan x="270.0" y="340.0">(either party, before</tspan><tspan x="270.0" y="355.0">the second signature)</tspan></text>
<rect x="395.0" y="308.5" width="250" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="325.0">5. Mark WITHDRAWN, release</tspan><tspan x="520" y="340.0">the reservation, notify</tspan><tspan x="520" y="355.0">the other party</tspan></text>
<circle cx="270.0" cy="415" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="270.0" cy="415" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="441.5">Offer withdrawn</tspan></text>
<rect x="30.0" y="477.0" width="300" height="6" fill="black"/>
<rect x="10.0" y="503.5" width="160" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="90.0" y="520.0">6. Buyer signs:</tspan><tspan x="90.0" y="535.0">consent, step-up</tspan><tspan x="90.0" y="550.0">login, e-mail OTP</tspan></text>
<rect x="190.0" y="503.5" width="160" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="520.0">7. Seller signs:</tspan><tspan x="270.0" y="535.0">consent, step-up</tspan><tspan x="270.0" y="550.0">login, e-mail OTP</tspan></text>
<path d="M412.5,504.5 L617.5,504.5 L627.5,514.5 L627.5,565.5 L412.5,565.5 Z" fill="white" stroke="black"/><path d="M617.5,504.5 L617.5,514.5 L627.5,514.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="422.5" y="520.0">Either party may sign first;</tspan><tspan x="422.5" y="535.0">eligibility is rechecked at</tspan><tspan x="422.5" y="550.0">initiate and at verify (D37)</tspan></text>
<rect x="30.0" y="597.0" width="300" height="6" fill="black"/>
<rect x="395.0" y="621.0" width="250" height="78.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="637.5">8. Recheck both parties&#x27;</tspan><tspan x="520" y="652.5">eligibility, the same terms</tspan><tspan x="520" y="667.5">fingerprint and the funding</tspan><tspan x="520" y="682.5">schedule (D67)</tspan></text>
<polygon points="520,725.0 535.0,740 520,755.0 505.0,740" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="605.0" y="708.5" width="110" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="660" y="725.0">Reject the</tspan><tspan x="660" y="740.0">signature; retry</tspan><tspan x="660" y="755.0">or withdraw</tspan></text>
<rect x="395.0" y="796.0" width="250" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="812.5">9. Record the second</tspan><tspan x="520" y="827.5">signature (SIGNED)</tspan></text>
<rect x="395.0" y="871.0" width="250" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="887.5">10. Lock the required deposits</tspan><tspan x="520" y="902.5">(automatic retries)</tspan></text>
<polygon points="520,950.0 535.0,965 520,980.0 505.0,965" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="385.0" y="1013.5" width="270" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="1030.0">11. ACTIVE: finalize the reservation,</tspan><tspan x="520" y="1045.0">invalidate cancel requests;</tspan><tspan x="520" y="1060.0">continue with BF-04</tspan></text>
<circle cx="90.0" cy="1045" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="90.0" cy="1045" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="90.0" y="1071.5">Contract active</tspan></text>
<rect x="395.0" y="1111.0" width="250" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="1127.5">12. Stay SIGNED; notify both</tspan><tspan x="520" y="1142.5">parties and the Operator</tspan></text>
<polygon points="520,1190.0 535.0,1205 520,1220.0 505.0,1205" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="732.5" y="1173.5" width="165" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="815.0" y="1190.0">13. Fix the technical</tspan><tspan x="815.0" y="1205.0">cause; retry only the</tspan><tspan x="815.0" y="1220.0">missing legs</tspan></text>
<path d="M732.5,1259.5 L887.5,1259.5 L897.5,1269.5 L897.5,1350.5 L732.5,1350.5 Z" fill="white" stroke="black"/><path d="M887.5,1259.5 L887.5,1269.5 L897.5,1269.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="742.5" y="1275.0">Retrying does not reset</tspan><tspan x="742.5" y="1290.0">the 5-business-day</tspan><tspan x="742.5" y="1305.0">window; a late lock</tspan><tspan x="742.5" y="1320.0">success still gives</tspan><tspan x="742.5" y="1335.0">ACTIVE</tspan></text>
<rect x="187.5" y="1173.5" width="165" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="1190.0">14. Either party asks</tspan><tspan x="270.0" y="1205.0">to cancel: consent,</tspan><tspan x="270.0" y="1220.0">step-up, e-mail OTP</tspan></text>
<rect x="390.0" y="1268.5" width="260" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="1285.0">15. Check: both asked, or one</tspan><tspan x="520" y="1300.0">request standing 5 business days</tspan><tspan x="520" y="1315.0">after the first lock failure</tspan></text>
<polygon points="520,1360.0 535.0,1375 520,1390.0 505.0,1375" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="10.0" y="1336.0" width="160" height="78.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="90.0" y="1352.5">Wait; a party may</tspan><tspan x="90.0" y="1367.5">withdraw its own</tspan><tspan x="90.0" y="1382.5">request before</tspan><tspan x="90.0" y="1397.5">refunds begin</tspan></text>
<rect x="390.0" y="1423.5" width="260" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="1440.0">16. ACTIVATION_REFUND_PENDING:</tspan><tspan x="520" y="1455.0">stop lock retries, return every</tspan><tspan x="520" y="1470.0">locked deposit to its owner</tspan></text>
<polygon points="520,1515.0 535.0,1530 520,1545.0 505.0,1530" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="732.5" y="1498.5" width="165" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="815.0" y="1515.0">Alert the Operator;</tspan><tspan x="815.0" y="1530.0">the contract stays</tspan><tspan x="815.0" y="1545.0">pending</tspan></text>
<rect x="390.0" y="1576.0" width="260" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="520" y="1592.5">17. Zero lock: ACTIVATION_FAILED,</tspan><tspan x="520" y="1607.5">release the reservation</tspan></text>
<circle cx="270.0" cy="1600" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="270.0" cy="1600" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="270.0" y="1626.5">Activation failed</tspan></text>
