<path d="M90.0,1336.0 L90.0,1315 L390.0,1315" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M520,1390.0 L520,1423.5" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
