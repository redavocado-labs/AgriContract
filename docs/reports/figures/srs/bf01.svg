<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1110" version="1.1" viewBox="0 0 870 1110" width="870" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1110" width="870" x="0" y="0" /><rect fill="none" height="1110" stroke="black" width="290" x="0" y="0" /><line stroke="black" x1="0" x2="290" y1="34" y2="34" /><text fill="black" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" x="145" y="23">Guest / User</text><rect fill="none" height="1110" stroke="black" width="290" x="290" y="0" /><line stroke="black" x1="290" x2="580" y1="34" y2="34" /><text fill="black" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" x="435" y="23">Operator</text><rect fill="none" height="1110" stroke="black" width="290" x="580" y="0" /><line stroke="black" x1="580" x2="870" y1="34" y2="34" /><text fill="black" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" x="725" y="23">System</text><circle cx="145.0" cy="60.0" fill="black" r="12.0" /><rect fill="white" height="55" rx="8" stroke="black" width="230" x="30" y="90" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="113.5">Register with email, password</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="131.5">and BUYER / SELLER role</text><rect fill="white" height="55" rx="8" stroke="black" width="230" x="610" y="90" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="113.5">Create Keycloak account</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="131.5">and assign selected role</text><rect fill="white" height="68" rx="8" stroke="black" width="230" x="30" y="180" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="201.0">Open onboarding; submit</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="219.0">organization details and</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="237.0">supporting documents</text><rect fill="white" height="68" rx="8" stroke="black" width="230" x="610" y="180" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="210.0">Create PENDING profile;</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="228.0">send email verification OTP</text><rect fill="white" height="55" rx="8" stroke="black" width="230" x="30" y="285" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="308.5">Enter verification OTP</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="326.5">or request a new code</text><rect fill="white" height="55" rx="8" stroke="black" width="230" x="610" y="285" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="317.5">Validate verification OTP</text><polygon fill="white" points="725.0,365 760,389.0 725.0,413 690,389.0" stroke="black" /><rect fill="white" height="48" rx="8" stroke="black" width="230" x="30" y="365" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="145.0" y="394.0">Show error / resend code</text><rect fill="white" height="60" rx="8" stroke="black" width="230" x="610" y="455" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="472.0">Mark email verified;</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="490.0">make profile eligible for</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="508.0">KYC review</text><rect fill="white" height="60" rx="8" stroke="black" width="230" x="320" y="455" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="481.0">Review documents and</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="499.0">representative authority</text><polygon fill="white" points="435.0,550 470,574.0 435.0,598 400,574.0" stroke="black" /><rect fill="white" height="64" rx="8" stroke="black" width="230" x="320" y="635" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="654.0">Verify KYC and record</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="672.0">authorization expiry</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="690.0">or indefinite authorization</text><rect fill="white" height="64" rx="8" stroke="black" width="230" x="610" y="635" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="663.0">Set VERIFIED; email result;</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="681.0">allow trading if eligible</text><circle cx="725.0" cy="742.0" fill="white" r="12.0" stroke="black" /><circle cx="725.0" cy="742.0" fill="black" r="8.0" /><rect fill="white" height="52" rx="8" stroke="black" width="230" x="320" y="795" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="435.0" y="826.0">Reject with reason</text><rect fill="white" height="52" rx="8" stroke="black" width="230" x="610" y="795" /><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="817.0">Set REJECTED;</text><text fill="black" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle" x="725.0" y="835.0">email rejection reason</text><circle cx="725.0" cy="887.0" fill="white" r="12.0" stroke="black" /><circle cx="725.0" cy="887.0" fill="black" r="8.0" /><rect fill="#fafafa" height="155" stroke="black" stroke-dasharray="5,3" width="230" x="320" y="180" /><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="226.5">Email is prefilled and read-only.</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="242.5">OTP: 6 digits, 10 min validity;</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="258.5">5 attempts; 60 s resend cooldown.</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="274.5">If sending fails, allow resend.</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="290.5">KYC requires verified email.</text><rect fill="#fafafa" height="132" stroke="black" stroke-dasharray="5,3" width="810" x="30" y="935" /><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="979.0">Independent scheduled cleanup (D59): remove self-registered BUYER / SELLER accounts</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="995.0">and their profiles if email remains unverified beyond 24 hours from Keycloak creation.</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="1011.0">Verified accounts, staff and seed accounts are excluded; resending does not extend retention.</text><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="435.0" y="1027.0">Before KYC approval, sign-in is allowed but eligibility-gated trading actions are restricted.</text><polyline fill="none" points="145.0,72 145.0,90" stroke="black" stroke-width="1.15" /><polyline fill="none" points="141.08531019299892,81.89597607882591 145.0,90 148.91468980700108,81.89597607882591" stroke="black" /><polyline fill="none" points="260,117.5 610,117.5" stroke="black" stroke-width="1.15" /><polyline fill="none" points="601.8959760788259,121.41468980700107 610,117.5 601.8959760788259,113.58531019299893" stroke="black" /><polyline fill="none" points="725.0,145 725,162 145,162 145.0,180" stroke="black" stroke-width="1.15" /><polyline fill="none" points="141.08531019299892,171.8959760788259 145.0,180 148.91468980700108,171.8959760788259" stroke="black" /><polyline fill="none" points="145.0,248 145,265 725,265 725.0,248" stroke="black" stroke-width="1.15" /><polyline fill="none" points="728.9146898070011,256.1040239211741 725.0,248 721.0853101929989,256.1040239211741" stroke="black" /><polyline fill="none" points="840,214.0 855,214 855,276 145,276 145.0,285" stroke="black" stroke-width="1.15" /><polyline fill="none" points="141.08531019299892,276.8959760788259 145.0,285 148.91468980700108,276.8959760788259" stroke="black" /><polyline fill="none" points="260,312.5 610,312.5" stroke="black" stroke-width="1.15" /><polyline fill="none" points="601.8959760788259,316.4146898070011 610,312.5 601.8959760788259,308.5853101929989" stroke="black" /><polyline fill="none" points="725.0,340 725.0,365" stroke="black" stroke-width="1.15" /><polyline fill="none" points="721.0853101929989,356.8959760788259 725.0,365 728.9146898070011,356.8959760788259" stroke="black" /><polyline fill="none" points="690,389.0 260,389.0" stroke="black" stroke-width="1.15" /><polyline fill="none" points="268.1040239211741,385.0853101929989 260,389.0 268.1040239211741,392.9146898070011" stroke="black" /><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="480" y="382">[invalid]</text><polyline fill="none" points="145.0,365 145.0,340" stroke="black" stroke-width="1.15" /><polyline fill="none" points="148.91468980700108,348.1040239211741 145.0,340 141.08531019299892,348.1040239211741" stroke="black" /><polyline fill="none" points="725.0,413 725.0,455" stroke="black" stroke-width="1.15" /><polyline fill="none" points="721.0853101929989,446.8959760788259 725.0,455 728.9146898070011,446.8959760788259" stroke="black" /><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="758" y="437">[valid]</text><polyline fill="none" points="610,485.0 550,485.0" stroke="black" stroke-width="1.15" /><polyline fill="none" points="558.1040239211741,481.0853101929989 550,485.0 558.1040239211741,488.9146898070011" stroke="black" /><polyline fill="none" points="435.0,515 435.0,550" stroke="black" stroke-width="1.15" /><polyline fill="none" points="431.0853101929989,541.8959760788259 435.0,550 438.9146898070011,541.8959760788259" stroke="black" /><polyline fill="none" points="435.0,598 435.0,635" stroke="black" stroke-width="1.15" /><polyline fill="none" points="431.0853101929989,626.8959760788259 435.0,635 438.9146898070011,626.8959760788259" stroke="black" /><text fill="black" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle" x="473" y="619">[valid]</text><polyline fill="none" points="550,667.0 610,667.0" stroke="black" stroke-width="1.15" /><polyline fill="none" points="601.8959760788259,670.9146898070011 610,667.0 601.8959760788259,663.0853101929989" stroke="black" /><polyline fill="none" points="725.0,699 725.0,730" stroke="black" stroke-width="1.15" /><polyline fill="none" points="721.0853101929989,721.8959760788259 725.0,730 728.9146898070011,721.8959760788259" stroke="black" /><polyline fill="none" points="400,574.0 303,574 303,821 320,821.0" stroke="black" stroke-width="1