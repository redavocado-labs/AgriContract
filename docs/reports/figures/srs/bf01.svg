<path d="M225.0,125 L275.0,125" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M380.0,156.5 L380.0,215 L235.0,215" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M125.0,246.5 L125.0,295 L275.0,295" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M380.0,326.5 L380.0,375 L225.0,375" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M165.0,399.0 L165.0,455 L275.0,455" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M527.5,455 L485.0,455" fill="none" stroke="black" stroke-width="1.1" stroke-dasharray="5,4"/>
<path d="M380.0,475.0 L380.0,505.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M365.0,520 L160.0,520" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="178" y="502" width="41.296875" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="180" y="508.875">[invalid]</tspan></text>
<path d="M85,496.0 L85.0,399.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M380.0,535.0 L380.0,568.5" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="386.0" y="537" width="32.734375" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="388.0" y="543.875">[valid]</tspan></text>
<path d="M490.0,600 L635.0,600 L635.0,648.5" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M635.0,711.5 L635.0,740.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M635.0,770.0 L635.0,803.5" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="641.0" y="772" width="32.734375" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="643.0" y="778.875">[valid]</tspan></text>
<path d="M530.0,835 L485.0,835" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M275.0,835 L138.0,835" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M650.0,755 L746,755 L746,935 L710.0,935" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="657.0" y="737" width="41.296875" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="659.0" y="743.875">[invalid]</tspan></text>
<path d="M560.0,935 L485.0,935" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M275.0,935 L138.0,935" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<circle cx="125.0" cy="60" r="12.0" fill="black"/>
<rect x="25.0" y="93.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="125.0" y="110.0">1. Register with e-mail,</tspan><tspan x="125.0" y="125.0">password and the Buyer</tspan><tspan x="125.0" y="140.0">or Seller role</tspan></text>
<rect x="275.0" y="93.5" width="210" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="110.0">2. Create the Keycloak</tspan><tspan x="380.0" y="125.0">account and assign</tspan><tspan x="380.0" y="140.0">the selected role</tspan></text>
<rect x="15.0" y="183.5" width="220" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="125.0" y="200.0">3. Open onboarding; submit</tspan><tspan x="125.0" y="215.0">organization details and</tspan><tspan x="125.0" y="230.0">supporting documents</tspan></text>
<rect x="275.0" y="263.5" width="210" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="280.0">4. Create the PENDING</tspan><tspan x="380.0" y="295.0">profile; e-mail a</tspan><tspan x="380.0" y="310.0">verification OTP</tspan></text>
<rect x="25.0" y="351.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="125.0" y="367.5">5. Enter the OTP or</tspan><tspan x="125.0" y="382.5">request a new code</tspan></text>
<rect x="275.0" y="435.0" width="210" height="40" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="455.0">6. Validate the OTP</tspan></text>
<path d="M527.5,402.0 L732.5,402.0 L742.5,412.0 L742.5,508.0 L527.5,508.0 Z" fill="white" stroke="black"/><path d="M732.5,402.0 L732.5,412.0 L742.5,412.0" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="537.5" y="417.5">E-mail is prefilled, read-only.</tspan><tspan x="537.5" y="432.5">OTP: 6 digits, valid 10 min,</tspan><tspan x="537.5" y="447.5">5 attempts, 60 s resend</tspan><tspan x="537.5" y="462.5">cooldown; a failed send can</tspan><tspan x="537.5" y="477.5">be resent. KYC review needs</tspan><tspan x="537.5" y="492.5">a verified e-mail.</tspan></text>
<polygon points="380.0,505.0 395.0,520 380.0,535.0 365.0,520" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="10.0" y="496.0" width="150" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="85" y="512.5">7. Show the error;</tspan><tspan x="85" y="527.5">allow a resend</tspan></text>
<rect x="270.0" y="568.5" width="220" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="585.0">8. Mark the e-mail verified;</tspan><tspan x="380.0" y="600.0">the profile enters the</tspan><tspan x="380.0" y="615.0">KYC review queue</tspan></text>
<rect x="535.0" y="648.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="635.0" y="665.0">9. Review the documents</tspan><tspan x="635.0" y="680.0">and the authority</tspan><tspan x="635.0" y="695.0">to represent</tspan></text>
<polygon points="635.0,740.0 650.0,755 635.0,770.0 620.0,755" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="530.0" y="803.5" width="210" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="635.0" y="820.0">10. Verify KYC; record the</tspan><tspan x="635.0" y="835.0">authorization expiry</tspan><tspan x="635.0" y="850.0">(or indefinite)</tspan></text>
<rect x="275.0" y="803.5" width="210" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="820.0">11. Set VERIFIED, e-mail</tspan><tspan x="380.0" y="835.0">the result; trading is</tspan><tspan x="380.0" y="850.0">allowed if eligible</tspan></text>
<circle cx="125.0" cy="835" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="125.0" cy="835" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="125.0" y="861.5">Account verified</tspan></text>
<rect x="560.0" y="911.0" width="150" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="635.0" y="927.5">12. Reject with</tspan><tspan x="635.0" y="942.5">a reason</tspan></text>
<rect x="275.0" y="911.0" width="210" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="380.0" y="927.5">13. Set REJECTED, e-mail</tspan><tspan x="380.0" y="942.5">the rejection reason</tspan></text>
<circle cx="125.0" cy="935" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="125.0" cy="935" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="125.0" y="961.5">Account not verified</tspan></text>
<path d="M20.0,992.0 L730.0,992.0 L740.0,1002.0 L740.0,1068.0 L20.0,1068.0 Z" fill="white" stroke="black"/><path d="M730.0,992.0 L730.0,1002.0 L740.0,1002.0" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="30.0" y="1007.5">Scheduled cleanup (D59), independent of this flow: a self-registered Buyer or Seller whose e-mail is</tspan><tspan x="30.0" y="1022.5">still unverified 24 h after the Keycloak account was created is deleted with its profile. Verified, staff</tspan><tspan x="30.0" y="1037.5">and seed accounts are excluded; resending the OTP does not extend the 24 h. Before KYC approval the</tspan><tspan x="30.0" y="1052.5">user can sign in, but eligibility-gated trading actions are blocked.</tspan></text>
</svg>