spring:
  application:
    name: contract-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contract_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/agricontract/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Required by the java-eventing outbox poller: it marks an event published only once the broker routed and
    # confirmed it.
    publisher-confirm-type: correlated
    publisher-returns: true

# java-eventing outbox (D38): canonical events such as contract.signed. The Phase 1 contract_domain_events
# poller keeps publishing the older events to the same exchange.
agricontract:
  eventing:
    outbox:
      enabled: true
      exchange: agricontract.contracts

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:changeme}

service:
  internal-secret: ${SERVICE_INTERNAL_SECRET:changeme-internal}


feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

server:
  port: ${SERVER_PORT:8083}

product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

# Service to service only (D71): evidence uploads are streamed to storeOnBehalfOf, named files confirmed attached.
file-service:
  url: ${FILE_SERVICE_URL:http://localhost:8089}
  connect-timeout: PT5S
  # One upload is at most 10 MiB; the read timeout covers file-service storing it.
  read-timeout: PT60S

contract:
  calendar:
    # Comma-separated YYYY-MM-DD Vietnam public holidays (shared/java-business-calendar). Required: startup fails
    # without it.
    vietnam-holidays: ${VIETNAM_HOLIDAYS:}
  activation:
    # D42: from first escrow.deposit_lock_failed + this many business days, one party's cancel request is enough.
    one-sided-cancel-window-business-days: 5
  terms:
    template-code: VN_COFFEE_B2B
    template-version: "1.0"
    template-resource: classpath:contract-template/VN_COFFEE_B2B-1.0.md
    coffee-quality-profile-version: "1.0"
    level2-safety-buffer-rate: 0.15
  consent:
    sign-contract-version: "1.0"
    cancel-activation-version: "1.0"
    # Operational tier (consent design §4): checkbox + authenticated session, no OTP.
    milestone-action-versions:
      DECLARE_SELLER_WEIGHT: "1.0"
  milestone:
    # D75: the seller may correct the declared weight for this long after the first declaration (never extended),
    # while the buyer has not recorded receipt. Lower it on the demo (e.g. PT5M).
    weigh-correction-window: ${WEIGH_CORRECTION_WINDOW:PT1H}
    # Named evidence whose confirm-attached failed is sent again this often (file-service cleans orphans after 1 week).
    evidence-attach-retry-interval: PT5M
  signature:
    # signatureAuthMaxAgeSeconds (signature design §4): the password must have been entered this recently.
    auth-max-age-seconds: 300
  otp:
    expiry-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-sends-per-hour: 5
    pepper: ${OTP_PEPPER:dev-only-otp-pepper-change-me}

outbox:
  poller:
    fixed-delay-ms: 1000

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.agricontract: DEBUG
