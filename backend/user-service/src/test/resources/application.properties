# Loaded next to the main application.yml (and wins over it). Tests run without a broker, so the outbox poller is
# off; KycResultOutboxFlowIntegrationTest turns it back on against a RabbitMQ container.
agricontract.eventing.outbox.enabled=false
# Same for the reputation lock listener; ReputationLockFlowIntegrationTest starts it against its container.
spring.rabbitmq.listener.simple.auto-startup=false
user.dlq-monitor.enabled=false
# The purge job calls Keycloak; UnverifiedAccountPurgeIntegrationTest runs the use case against a container.
user.unverified-account.purge.enabled=false
keycloak.url=http://localhost:1
# The main config has no default for the internal secrets so the service refuses to start without them.
gateway.internal-secret=test-gateway-secret
service.internal-secret=test-service-secret
