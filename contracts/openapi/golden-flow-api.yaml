openapi: 3.1.0
info:
  title: AgriContract Golden Flow API
  version: 0.1.0
  description: >-
    API paths required by the authoritative Phase 2 use cases are frozen here.
    The Phase 1 cancel endpoint is retired; termination, breach review and mutual
    replacement use explicit idempotent commands below.
    Phase 2 new writes are limited to domestic Vietnam coffee contracts.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/contracts:
    x-service-owner: contract-service
    post:
      operationId: createContract
      x-roles: [BUYER]
      x-domain-ownership-check: true
      description: >-
        Create an OFFERED contract from an approved listing. Buyer identity comes from JWT;
        listing resolves seller/product ownership. Contract-service derives requestedQuantity
        as the sum of milestoneSchedule committedQuantity, generates contractId, and calls the
        synchronous product-service reservation API before persisting OFFERED. Only a successful
        atomic reservation may be followed by the local Contract/outbox transaction. If local
        persistence fails after reserve, contract-service calls the idempotent compensation release.
        Insufficient, below-minimum, or legacy-null inventory returns 409
        INSUFFICIENT_LISTING_QUANTITY; clients reload the listing and never blind-retry.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateContractRequest'}}}}
      responses:
        '201': {description: Contract created, content: {application/json: {schema: {$ref: '#/components/schemas/ContractResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: Eligibility or product reservation dependency unavailable; create offer fails closed and no unreserved OFFERED contract is persisted.}
    get:
      operationId: listContracts
      parameters:
        - {name: role, in: query, required: false, schema: {enum: [BUYER, SELLER]}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses: {'200': {description: Participant-owned paginated contract list, content: {application/json: {schema: {$ref: '#/components/schemas/ContractPage'}}}}}
  /api/v1/contracts/{contractId}:
    x-service-owner: contract-service
    get:
      operationId: getContract
      parameters: [{name: contractId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Participant-owned contract detail, content: {application/json: {schema: {$ref: '#/components/schemas/ContractResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v1/contracts/{contractId}/document-preview:
    x-service-owner: contract-service
    get:
      operationId: previewContractDocument
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: Server-rendered preview of the current offer/negotiation snapshot. Every page or prominent header must carry CHƯA CÓ HIỆU LỰC; this representation is never the final signed document.
      parameters: [{name: contractId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Draft PDF preview with mandatory invalidity watermark, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/contracts/{contractId}/documents:
    x-service-owner: contract-service
    get:
      operationId: listContractDocuments
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      parameters: [{name: contractId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Participant-owned document metadata, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ContractDocumentResponse'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/contracts/{contractId}/documents/{documentId}:
    x-service-owner: contract-service
    get:
      operationId: getContractDocument
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: Owner-authorized contract-service proxy for immutable READY document bytes; MinIO object keys are never exposed.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Immutable contract document bytes, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Document metadata exists but status is PENDING or FAILED; caller must reread the document list and must not repeat signing.}
  /api/v1/contracts/{contractId}/terms:
    x-service-owner: contract-service
    patch:
      operationId: updateContractTerms
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContractTermsInput'}}}}
      responses: {'200': {description: Contract terms updated before first signature, content: {application/json: {schema: {$ref: '#/components/schemas/ContractResponse'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/sign/initiate:
    x-service-owner: contract-service
    post:
      operationId: initiateSign
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        InitiateSign first validates and persists action-specific checkbox consent bound to the
        current signedContentHash, then creates and persists the OTP challenge and
        synchronously requests OTP email delivery. In the challenge transaction, every still-valid
        prior challenge for the same signer, contractId and signedContentHash is atomically expired
        before the new otpId is inserted. Resend therefore leaves only the newest challenge valid;
        this rule changes neither the request nor response shape.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InitiateSignRequest'}}}}
      responses:
        '200':
          description: Notification provider accepted the OTP request; no Signature row is created yet.
          content: {application/json: {schema: {$ref: '#/components/schemas/InitiateSignResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '5XX': {description: Notification provider failure; no delayed retry is performed.}
  /api/v1/contracts/{contractId}/sign/verify:
    x-service-owner: contract-service
    post:
      operationId: verifyOtpAndSign
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        VerifyOtpAndSign(otpId, contractId, otpCode) verifies the bound challenge and inserts the
        Signature row. Lookup remains by otpId, but an older challenge expired by resend is rejected
        even when its OTP code is correct. Before the second signature transitions to SIGNED,
        contract-service requires sum(milestoneSchedule.committedQuantity) == reservedQuantity;
        mismatch fails closed with 409 and publishes no contract.signed event.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOtpAndSignRequest'}}}}
      responses:
        '204': {description: OTP accepted and signature inserted; the second valid signature transitions the contract to SIGNED.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/withdraw:
    x-service-owner: contract-service
    post:
      operationId: withdrawOffer
      x-roles: [BUYER, SELLER]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Offer withdrawn before the second signature; publishes contract.terminated with WITHDRAW_OFFER.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/termination/mutual/propose:
    x-service-owner: contract-service
    post:
      operationId: proposeMutualTermination
      x-roles: [BUYER, SELLER]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Mutual termination proposal recorded; the counterparty must confirm.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/termination/mutual/confirm:
    x-service-owner: contract-service
    post:
      operationId: confirmMutualTermination
      x-roles: [BUYER, SELLER]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Mutual termination accepted; remedy.finalized is emitted and contract.terminated follows only after zero-lock reconciliation.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/replacement/propose:
    x-service-owner: contract-service
    post:
      operationId: proposeMutualReplacement
      x-roles: [BUYER, SELLER]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplacementProposalRequest'}}}}
      responses:
        '201': {description: Replacement draft created, content: {application/json: {schema: {$ref: '#/components/schemas/ContractResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/replacement/confirm:
    x-service-owner: contract-service
    post:
      operationId: confirmMutualReplacement
      x-roles: [BUYER, SELLER]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Replacement consent recorded; old contract commits only after the replacement reaches SIGNED.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/breach-cases:
    x-service-owner: contract-service
    post:
      operationId: reportBreachCase
      x-roles: [BUYER, SELLER, SYSTEM]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreachCaseReportRequest'}}}}
      responses:
        '201': {description: Breach case reported and breach.reported published, content: {application/json: {schema: {$ref: '#/components/schemas/BreachCase'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/breach-cases/{breachCaseId}/review:
    x-service-owner: contract-service
    post:
      operationId: reviewBreachCase
      x-roles: [ARBITRATOR]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: breachCaseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses: {'204': {description: Case moved to UNDER_REVIEW.}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/breach-cases/{breachCaseId}/resolve:
    x-service-owner: contract-service
    post:
      operationId: resolveBreachCase
      x-roles: [ARBITRATOR]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: breachCaseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreachCaseResolutionRequest'}}}}
      responses: {'204': {description: 'AttributionDecision persisted. remedy.finalized is published immediately for no-fault or refund/release-only remedies and for contract-level cases (milestoneId null, never contestable); a milestone-level fault decision with sanctions waits for contestDeadline (milestone-escrow 6.4 and GB-50). Terminal lifecycle waits for reconciliation. D81 (22/11/2026): when the case carries computedResolution (a contested milestone with a confirmed Level 1.5 report), the request must equal it (finalBreachingRole, decisionSource INSPECTOR_L1_5) and the Arbitrator only approves; a mismatch is 409 RESOLUTION_MISMATCH, a contested milestone whose report is not confirmed yet is 409 INSPECTION_REPORT_PENDING.'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/breach-cases/{breachCaseId}/contest:
    x-service-owner: contract-service
    post:
      operationId: contestBreachDecision
      x-roles: [BUYER, SELLER]
      description: >-
        One-time contest by the participant whose role equals finalBreachingRole,
        before contestDeadline. Routes the case to Level 1.5
        (inspection.level1_5_requested, reason DECISION_CONTESTED); the Level 1.5
        result creates a new AttributionDecision (decisionSource INSPECTOR_L1_5)
        that supersedes the Arbitrator decision. D85/D91 (23/11/2026): a NON_CONFORMING
        decision approved from computedResolution is contestable once; the second Level 1.5
        result is final (Arbitrator approves it as D81, remedy.finalized right after, no new
        window, contestStatus never reopens). 409 when contestStatus is not OPEN. Contract-level
        cases (milestoneId null) are never contestable on the platform. No consent statement:
        a contest only asks for a re-inspection. evidenceFileIds are READY files the caller
        uploaded; more can be added with contestBreachDecisionEvidence. Source milestone-escrow
        design 6.4, SRS v1.6 GB-50.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: breachCaseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreachContestRequest'}}}}
      responses: {'204': {description: Contest recorded; sanctions stay unpublished until the Level 1.5 decision.}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/breach-cases/{breachCaseId}/contest/evidence:
    x-service-owner: contract-service
    post:
      operationId: contestBreachDecisionEvidence
      x-roles: [BUYER, SELLER]
      description: >-
        D91 (23/11/2026): the participant who contested adds evidence files to the contest
        while the second Level 1.5 report is not confirmed yet. Files must be READY and
        uploaded by the caller; ids already attached are ignored (idempotent). 409 when the
        case is not CONTESTED or the second report is already confirmed.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: breachCaseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreachContestEvidenceRequest'}}}}
      responses: {'204': {description: Evidence attached to the contest.}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/termination/execute:
    x-service-owner: contract-service
    post:
      operationId: executeTermination
      x-roles: [BUYER, SELLER, ARBITRATOR]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TerminationExecuteRequest'}}}}
      responses: {'204': {description: Final attribution/remedy workflow started; terminal lifecycle waits for reconciliation.}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/activation/retry-deposit-lock:
    x-service-owner: contract-service
    post:
      operationId: retryDepositLock
      x-roles: [OPERATOR]
      description: >-
        OPERATOR-only technical recovery after escrow.deposit_lock_failed, once the cause is fixed: escrow runs a
        new automatic retry cycle for the legs that are not LOCKED. It does not move oneSidedCancelAllowedFrom and is
        refused (409) once the refund has started. Stopping the contract belongs to the parties
        (/activation/cancel/*), not to OPERATOR.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Retry accepted; escrow retries only the missing leg.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/remedy/retry-legs:
    x-service-owner: contract-service
    post:
      operationId: retryRemedyLegs
      x-roles: [OPERATOR]
      description: >-
        OPERATOR-only technical recovery (D93) after a remedy leg ran out of retries and the cause is fixed:
        contract-service writes contract.remedy_retry_requested and escrow resends every FAILED remedy leg of
        the contract with its original command id. COMPLETED legs are never resent. It cannot change amounts,
        payees or the decision. Accepted (204) while the contract is ACTIVE even if no leg is FAILED (escrow
        no-op).
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Retry accepted; escrow resends only FAILED remedy legs.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "REMEDY_RETRY_NOT_ALLOWED: the contract is not ACTIVE.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/activation/cancel/initiate:
    x-service-owner: contract-service
    post:
      operationId: initiateActivationCancel
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        A party asks to stop a SIGNED contract whose deposit lock failed (escrow.deposit_lock_failed received)
        before it became ACTIVE. High-risk consent tier, like signing: checkbox statement CANCEL_ACTIVATION bound
        to the current signedContentHash, a fresh login (auth_time within 300 s) and an emailed OTP. Records the
        consent and the OTP challenge in one transaction and requests the OTP email with purpose CANCEL_ACTIVATION.
        No cancel request exists until /activation/cancel/verify.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InitiateActivationCancelRequest'}}}}
      responses:
        '200':
          description: OTP email accepted by notification-service; no cancel request is recorded yet.
          content: {application/json: {schema: {$ref: '#/components/schemas/InitiateSignResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/activation/cancel/verify:
    x-service-owner: contract-service
    post:
      operationId: verifyActivationCancel
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Checks the CANCEL_ACTIVATION OTP and records this party's cancel request. In the same transaction, when
        both parties have a standing request, or one party has and now >= oneSidedCancelAllowedFrom (5 business
        days after the first escrow.deposit_lock_failed of the contract), the contract moves
        SIGNED -> ACTIVATION_REFUND_PENDING and writes contract.activation_refund_requested. A one-sided request
        made earlier is executed by contract-service when that instant passes, without a further call. No
        OPERATOR approval exists in this path.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOtpAndSignRequest'}}}}
      responses:
        '204': {description: Cancel request recorded; the refund starts at once when the conditions above hold.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/activation/cancel:
    x-service-owner: contract-service
    delete:
      operationId: withdrawActivationCancel
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Withdraws the caller's own standing cancel request while the contract is still SIGNED. Once the refund
        has started (ACTIVATION_REFUND_PENDING) nothing can be withdrawn (409).
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: The caller's cancel request is withdrawn.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/breach-cases/{breachCaseId}:
    x-service-owner: contract-service
    get:
      operationId: getBreachCase
      x-roles: [BUYER, SELLER, ARBITRATOR]
      x-domain-ownership-check: true
      description: >-
        D84 (22/11/2026). One breach case of a contract, computedResolution included. BUYER/SELLER must be a party of
        the contract (403 otherwise, checked before the case lookup); ARBITRATOR reads any case.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: breachCaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The breach case., content: {application/json: {schema: {$ref: '#/components/schemas/BreachCase'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/arbitration/breach-cases:
    x-service-owner: contract-service
    get:
      operationId: listBreachCasesForArbitration
      x-roles: [ARBITRATOR]
      description: >-
        D84 (22/11/2026). The ARBITRATOR work queue across all contracts, newest reportedAt first. awaitingApproval=true
        keeps only cases that are not RESOLVED and carry a computedResolution (D81: the Level 1.5 report is confirmed
        and the Arbitrator only has to approve). The gateway routes /api/v1/arbitration/** to contract-service.
      parameters:
        - {name: status, in: query, required: false, schema: {enum: [REPORTED, UNDER_REVIEW, RESOLVED]}}
        - {name: awaitingApproval, in: query, required: false, schema: {type: boolean}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: One page of breach cases., content: {application/json: {schema: {$ref: '#/components/schemas/BreachCasePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}:
    x-service-owner: contract-service
    get:
      operationId: getMilestoneDetail
      x-roles: [BUYER, SELLER, ARBITRATOR, OPERATOR]
      x-domain-ownership-check: true
      description: >-
        D84 (22/11/2026). Read model of one milestone for the BF-04 screens: the MilestoneResponse summary plus the
        current seller declaration, the buyer receipt, the flag, every evidence file with its scan status, the
        settlement result and the open breach case. BUYER/SELLER must be a party of the contract (403 otherwise,
        checked before the milestone lookup, same order as uploadMilestoneEvidence); ARBITRATOR and OPERATOR read any
        milestone. Every deadline is computed by the server (UTC instants); the client never derives one.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The milestone read model., content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneDetailResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/evidence/{fileId}:
    x-service-owner: contract-service
    get:
      operationId: readMilestoneEvidence
      x-roles: [BUYER, SELLER, ARBITRATOR]
      x-domain-ownership-check: true
      description: >-
        D84 (22/11/2026), file-service design (proxy through the owning service). Streams the bytes of an evidence file
        recorded for this milestone, so the other party and the Arbitrator can see the photos. BUYER/SELLER must be a
        party (403 first); the file must be recorded for this milestone (404 otherwise, never a probe into
        file-service) and READY (409 EVIDENCE_NOT_READY while PROCESSING, 409 EVIDENCE_REJECTED when FAILED).
        contract-service reads the bytes through the internal file-service GET (#274) and copies Content-Type;
        Cache-Control is private, no-store.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The file bytes.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "EVIDENCE_NOT_READY or EVIDENCE_REJECTED.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: "file-service unavailable; safe to retry.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/evidence:
    x-service-owner: contract-service
    post:
      operationId: uploadMilestoneEvidence
      x-roles: [SELLER, BUYER]
      x-domain-ownership-check: true
      description: >-
        milestone-escrow design §3.2.1 (D71, 22/11/2026). A party uploads a weighing photo or a delivery
        certificate for this milestone; the file is recorded against the milestone and the uploader. Checks run in
        this order: party of this contract (403), milestone of this contract (404), the uploader's turn (409):
        SELLER while the milestone is IN_PROGRESS, or SELLER_WEIGHED inside the correction window (D75); BUYER while
        it is SELLER_WEIGHED; D91 (23/11/2026): on a CONTESTED milestone, the party whose role is the case's
        finalBreachingRole while contestStatus is OPEN, and the party who contested while contestStatus is CONTESTED
        and the contest's Level 1.5 report is not confirmed yet. The body is the raw file, streamed, with the rules of file-service storeOnBehalfOf
        (D60): Content-Type image/jpeg, image/png or application/pdf, Content-Length required (no chunked body), at
        most 10 MiB. contract-service streams it to storeOnBehalfOf with X-Acting-User-Id = the caller and the same
        Idempotency-Key. The file is PROCESSING until file.ready or file.failed arrives; only a file recorded here
        for this milestone and this uploader can be named by weigh/confirm/flag/contest. Uploading again with a new key
        gives a new file; files that are never named are cleaned by file-service.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 1, maximum: 10485760}}
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          application/pdf: {schema: {type: string, format: binary}}
      responses:
        '202': {description: "Stored and recorded for this milestone and uploader, or a repeat of the same Idempotency-Key with the file's current status.", content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneEvidenceAccepted'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: not the uploader's turn on this milestone, or the contract is not ACTIVE.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '413': {description: "FILE_TOO_LARGE: Content-Length over 10 MiB (10485760 bytes).", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: "file-service unavailable; nothing recorded, safe to retry with the same Idempotency-Key.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/weigh:
    x-service-owner: contract-service
    post:
      operationId: recordSellerWeighed
      x-roles: [SELLER]
      x-domain-ownership-check: true
      description: >-
        milestone-escrow design §3.2.1 (D71-D75). The SELLER of an ACTIVE contract declares the loaded weight of an
        IN_PROGRESS milestone: the milestone enters SELLER_WEIGHED and milestone.seller_weighed is published
        (declarationNumber 1). The same call on a SELLER_WEIGHED milestone corrects the declaration while the
        correction window is open (1 hour from the first declaration, configurable, never extended by a correction)
        and the buyer has not recorded receipt; each correction is kept as a new declaration and publishes
        milestone.seller_weighed again with the next declarationNumber. sellerEvidenceFileId and
        deliveryCertificateFileId must be files this seller uploaded through uploadMilestoneEvidence for this
        milestone, must differ, and must be READY. consent is the DECLARE_SELLER_WEIGHT statement (consent design §4,
        authenticated session, no OTP); presentedContentHash is recomputed by the server from the milestone and the
        declared weight and files. Checks run in this order: party (403), milestone of this contract (404), request
        (400), state and files (409). A late declaration (past effectiveDeliveryDeadline) is accepted while the
        milestone is still IN_PROGRESS (D73).
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SellerWeighedRequest'}}}}
      responses:
        '204': {description: "Milestone is SELLER_WEIGHED with this declaration and milestone.seller_weighed is published; a repeat of the same Idempotency-Key returns 204 without a new declaration."}
        '400': {description: "VALIDATION_ERROR; EVIDENCE_NOT_UPLOADED: a file was not uploaded by this seller for this milestone; EVIDENCE_FILE_REUSED: sellerEvidenceFileId equals deliveryCertificateFileId.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: the contract is not ACTIVE or the milestone is neither IN_PROGRESS nor correctable; WEIGH_CORRECTION_CLOSED: the correction window has passed or the buyer has recorded receipt; EVIDENCE_NOT_READY: a file is still being scanned (retry shortly); EVIDENCE_REJECTED: a file failed the scan (upload another); CONSENT_STATEMENT_OUTDATED; CONSENT_CONTENT_MISMATCH: presentedContentHash does not match the declaration.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/receive:
    x-service-owner: contract-service
    post:
      operationId: recordBuyerReceipt
      x-roles: [BUYER]
      x-domain-ownership-check: true
      description: >-
        milestone-escrow design §3.2.2 (D76, 22/11/2026). Step 1 of receipt: the BUYER of an ACTIVE contract records
        the unloaded weight of a SELLER_WEIGHED milestone. The milestone enters BUYER_RECEIVED, the seller's
        correction window closes (D75), the buyerConfirmWindowDays clock starts and milestone.buyer_received is
        published. buyerEvidenceFileId and deliveryCertificateFileId follow the same file rules as weigh: uploaded by
        this buyer through uploadMilestoneEvidence for this milestone, different from each other, READY. Weight has
        the D72 bounds. consent is the RECORD_BUYER_RECEIPT statement (authenticated session, no OTP);
        presentedContentHash is recomputed from the milestone, the weight and the files. No correction: a wrong
        receipt is disputed through flag. Checks run party (403), milestone of this contract (404), request (400),
        state and files (409).
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerReceivedRequest'}}}}
      responses:
        '204': {description: "Milestone is BUYER_RECEIVED and milestone.buyer_received is published; a repeat of the same Idempotency-Key returns 204."}
        '400': {description: "VALIDATION_ERROR; EVIDENCE_NOT_UPLOADED; EVIDENCE_FILE_REUSED.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: the contract is not ACTIVE or the milestone is not SELLER_WEIGHED; EVIDENCE_NOT_READY; EVIDENCE_REJECTED; CONSENT_STATEMENT_OUTDATED; CONSENT_CONTENT_MISMATCH.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/confirm:
    x-service-owner: contract-service
    post:
      operationId: confirmMilestoneClean
      x-roles: [BUYER]
      x-domain-ownership-check: true
      description: >-
        milestone-escrow design §3.2.2 (D76-D78). Step 2, clean: the BUYER confirms a BUYER_RECEIVED milestone inside
        buyerConfirmWindowDays. The milestone becomes SETTLED with actualAmount from §4 (transit loss inside
        toleranceRate borne by the buyer, the excess split 50/50, capped at lockedAmount, D65 rounding);
        milestone.settled and milestone.buyer_confirmed (confirmedBy BUYER) are published. consent is the
        CONFIRM_CLEAN_RECEIPT statement, which states that confirming receipt does not waive inspection or claim rights
        still open under the contract; presentedContentHash is recomputed from the milestone and both recorded weights.
        A milestone with MANDATORY_BEFORE_SETTLEMENT and no confirmed report cannot be confirmed.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentInput'}}}}
      responses:
        '204': {description: "Milestone is SETTLED and milestone.settled is published; a repeat of the same Idempotency-Key returns 204."}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: the contract is not ACTIVE or the milestone is not BUYER_RECEIVED; INSPECTION_REPORT_PENDING: mandatory inspection has no confirmed report; CONSENT_STATEMENT_OUTDATED; CONSENT_CONTENT_MISMATCH.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/flag:
    x-service-owner: contract-service
    post:
      operationId: flagMilestoneIssue
      x-roles: [BUYER]
      x-domain-ownership-check: true
      description: >-
        milestone-escrow design §3.2.2 (D76, D82). Step 2, dispute: the BUYER flags a BUYER_RECEIVED milestone inside
        buyerConfirmWindowDays. issueType QUANTITY disputes the weight only; QUALITY disputes quality (the inspection
        checks quantity and metrics). The milestone becomes AWAITING_SELLER_RESPONSE and milestone.flagged is
        published; no money or reputation consequence. consent is the FLAG_MILESTONE_ISSUE statement;
        presentedContentHash is recomputed from the milestone, both recorded weights and issueType. If the seller
        does not respond within sellerResponseWindowDays, a QUANTITY flag settles on the buyer's weight and a QUALITY
        flag is routed to Level 1.5 (D82).
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneFlagRequest'}}}}
      responses:
        '204': {description: "Milestone is AWAITING_SELLER_RESPONSE and milestone.flagged is published; a repeat of the same Idempotency-Key returns 204."}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: the contract is not ACTIVE, the milestone is not BUYER_RECEIVED or the confirm window has passed; CONSENT_STATEMENT_OUTDATED; CONSENT_CONTENT_MISMATCH.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/respond:
    x-service-owner: contract-service
    post:
      operationId: respondToMilestoneFlag
      x-roles: [SELLER]
      x-domain-ownership-check: true
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string}}
        - {name: milestoneId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: >-
        milestone-escrow design §3.2.2 (D80). The SELLER contests an AWAITING_SELLER_RESPONSE milestone inside
        sellerResponseWindowDays. The milestone becomes CONTESTED, a BreachCase is opened as an allegation only
        (requestedBy BUYER, allegedBreachingRole SELLER, SHORTFALL for QUANTITY or QUALITY_BELOW_COMMITTED for QUALITY)
        and inspection.level1_5_requested is published with reason DISPUTE_ROUTED (straight to Level 1.5). consent is
        the CONTEST_MILESTONE_FLAG statement. Accepting the buyer's position actively is concede (D57).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentInput'}}}}
      responses:
        '204': {description: "Milestone is CONTESTED and Level 1.5 is requested; a repeat of the same Idempotency-Key returns 204."}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "MILESTONE_ACTION_NOT_ALLOWED: the milestone is not AWAITING_SELLER_RESPONSE or the response window has passed; CONSENT_STATEMENT_OUTDATED; CONSENT_CONTENT_MISMATCH.", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/force-majeure:
    x-service-owner: contract-service
    post:
      operationId: claimForceMajeure
      x-roles: [SELLER]
      x-domain-ownership-check: true
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string}}
        - {name: milestoneId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForceMajeureClaimRequest'}}}}
      responses: {'204': {description: Claim recorded and milestone enters FORCE_MAJEURE_PENDING_REVIEW.}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/force-majeure/resolve:
    x-service-owner: contract-service
    post:
      operationId: resolveForceMajeure
      x-roles: [ARBITRATOR]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string}}
        - {name: milestoneId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForceMajeureResolveRequest'}}}}
      responses: {'204': {description: ARBITRATOR decision recorded and milestone.force_majeure_resolved published.}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/dispute/concede/initiate:
    x-service-owner: contract-service
    post:
      operationId: initiateDisputeConcession
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        A party accepts the other party's position in an open milestone dispute (D57, milestone-escrow design
        section 3.4). D92: also while the flag waits for the seller's response, where the seller accepting the
        flag and the buyer withdrawing it are both a concession. Not allowed once a COMPLETE Level 1.5 report
        decides the dispute, for a case opened by mandatory inspection, or for the Level 2 buffer fallback
        (409 DISPUTE_EXIT_NOT_ALLOWED). High-risk consent: checkbox statement
        CONCEDE_DISPUTE bound to the current signedContentHash, a fresh login (auth_time within 300 s) and an emailed
        OTP with purpose CONCEDE_DISPUTE. Nothing changes until /dispute/concede/verify.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InitiateDisputeConcessionRequest'}}}}
      responses:
        '200':
          description: OTP email accepted by notification-service; nothing is recorded yet.
          content: {application/json: {schema: {$ref: '#/components/schemas/InitiateSignResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/dispute/concede/verify:
    x-service-owner: contract-service
    post:
      operationId: verifyDisputeConcession
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Checks the CONCEDE_DISPUTE OTP and ends the dispute on the other party's position, in one transaction:
        AttributionDecision (decisionSource MUTUAL, finalBreachingRole and breachReasonCode of the accepted position),
        RemedyDecision (inspection fee on the conceding party when an inspector was assigned and its freeCancelUntil
        has passed), remedy.finalized, milestone.dispute_resolved for a buyer flag, and inspection.level1_5_cancelled
        when a Level 1.5 request is pending. Any open settlement proposal lapses.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOtpAndSignRequest'}}}}
      responses:
        '204': {description: Dispute ended on the other party's position.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/dispute/settlement/initiate:
    x-service-owner: contract-service
    post:
      operationId: initiateDisputeSettlement
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Proposes, or accepts, an agreed seller entitlement for the disputed milestone (D57, milestone-escrow design
        section 3.4). With no open proposal the caller proposes; with an open proposal from the other party the
        caller accepts and must send exactly the proposed amount (409 SETTLEMENT_PROPOSAL_CONFLICT otherwise).
        D92: only on a CONTESTED milestone before a COMPLETE report of the pending round (409
        DISPUTE_EXIT_NOT_ALLOWED). The amount must lie between the
        buyer's and the seller's positions computed by contract-service, both ends included (400 otherwise).
        At most one open proposal per milestone; the proposer cannot accept its own proposal (409). High-risk
        consent: checkbox statement SETTLE_DISPUTE bound to the current signedContentHash, fresh login and an
        emailed OTP with purpose SETTLE_DISPUTE. Nothing changes until /dispute/settlement/verify.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InitiateDisputeSettlementRequest'}}}}
      responses:
        '200':
          description: OTP email accepted by notification-service; nothing is recorded yet.
          content: {application/json: {schema: {$ref: '#/components/schemas/InitiateSignResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/dispute/settlement/verify:
    x-service-owner: contract-service
    post:
      operationId: verifyDisputeSettlement
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Checks the SETTLE_DISPUTE OTP. For a proposal it records the open proposal and notifies the other party;
        the inspection keeps running. For an acceptance it ends the dispute in one transaction: AttributionDecision
        (decisionSource MUTUAL, no fault), RemedyDecision (inspection fee on the party that requested the
        inspection when an inspector was assigned and its freeCancelUntil has passed; split between both parties
        for a first report that came back INCONCLUSIVE, D92), remedy.finalized, and
        inspection.level1_5_cancelled when a Level 1.5 request is pending. No milestone.dispute_resolved.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyOtpAndSignRequest'}}}}
      responses:
        '204': {description: 'Proposal recorded, or dispute ended on the agreed amount.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/dispute/settlement:
    x-service-owner: contract-service
    delete:
      operationId: withdrawDisputeSettlement
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Ends the open settlement proposal: the proposer withdraws it or the other party refuses it. The dispute and
        any inspection continue. No open proposal: 409 SETTLEMENT_PROPOSAL_CONFLICT.
      security: [{bearerAuth: []}]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Open proposal ended.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/funding/retry:
    x-service-owner: escrow-service
    post:
      operationId: retryMilestoneFunding
      x-roles: [OPERATOR]
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses: {'204': {description: Retry accepted for the failed funding leg.}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/price-adjustments/propose:
    x-service-owner: contract-service
    post:
      operationId: proposeMilestonePriceAdjustment
      summary: Propose a bounded milestone unit price before funding
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Creates or replaces the single pending proposal before the milestone funding
        request is emitted. JWT authenticates the proposer; OTP is not used because
        the signed price band already authorizes the bounded runtime selection.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceAdjustmentProposalRequest'}}}}
      responses:
        '201': {description: Pending proposal created or replaced, content: {application/json: {schema: {$ref: '#/components/schemas/PendingPriceAdjustment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Price is outside the signed band, funding was already requested, or an adjustment was already accepted.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /api/v1/contracts/{contractId}/milestones/{milestoneId}/price-adjustments/{proposalId}/accept:
    x-service-owner: contract-service
    post:
      operationId: acceptMilestonePriceAdjustment
      summary: Accept the counterparty's bounded milestone price proposal
      x-roles: [BUYER, SELLER]
      x-domain-ownership-check: true
      description: >-
        Counterparty-only authenticated accept. The immutable accepted record is
        created and milestone.price_adjusted is published; ContractTerms and
        signedContentHash remain unchanged.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: proposalId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentInput'}}}}
      responses:
        '200': {description: Adjustment accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedPriceAdjustment'}}}}
        '403':
          description: Proposer attempted self-accept or caller is not a participant.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proposal is stale, funding was already requested, or another adjustment was already accepted.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /api/v1/users/register:
    x-service-owner: user-service
    post:
      operationId: registerUser
      security: [{bearerAuth: []}]
      responses:
        '2XX': {description: 'Idempotent registration; exact success status is not frozen. The body email is stored unverified (#344) and receives no notification until confirmed. A new profile is emailed its first verification code right after it is stored, and the response adds verificationEmailSent (boolean) and, when true, verificationCodeExpiresAt (date-time); registration still succeeds with verificationEmailSent false when the email could not be sent, and the client offers a resend. An existing profile is returned without these fields and gets no new code.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: New profile only - EMAIL_ALREADY_CLAIMED, another account has already verified this email (accepted disclosure, user-service design 4.4). An existing profile is returned unchanged instead.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /api/v1/users/me/email-verification:
    x-service-owner: user-service
    post:
      operationId: requestEmailVerification
      security: [{bearerAuth: []}]
      description: Resends a 6-digit code to the caller's contact email (notification-service otp-email, purpose VERIFY_EMAIL); registerUser sends the first one. Replaces any pending code.
      responses:
        '202':
          description: Email accepted by notification-service.
          content: {application/json: {schema: {type: object, required: [expiresAt], properties: {expiresAt: {type: string, format: date-time}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: EMAIL_ALREADY_VERIFIED, EMAIL_ALREADY_CLAIMED or VERIFICATION_RESEND_TOO_SOON.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '503': {description: 'VERIFICATION_EMAIL_NOT_SENT - the email was not accepted; the unsent code is expired and the caller may ask again at once (the resend cooldown does not apply to it).'}
  /api/v1/users/me/email-verification/confirm:
    x-service-owner: user-service
    post:
      operationId: confirmEmailVerification
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, pattern: '^[0-9]{6}$'}}
              additionalProperties: false
      responses:
        '2XX': {description: Email verified; returns the own profile with emailVerified true.}
        '400':
          description: Malformed code, or VERIFICATION_CODE_INVALID (the wrong guess is counted).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: EMAIL_ALREADY_VERIFIED, EMAIL_ALREADY_CLAIMED, VERIFICATION_NOT_REQUESTED, VERIFICATION_EXPIRED or VERIFICATION_ATTEMPTS_EXHAUSTED.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /api/v1/users/me:
    x-service-owner: user-service
    get:
      operationId: getMyProfile
      responses:
        '2XX': {description: Full participant profile; exact response wire shape is not frozen.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users/{userId}:
    x-service-owner: user-service
    get:
      operationId: getPublicUser
