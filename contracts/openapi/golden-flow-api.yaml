      responses:
        '200':
          description: Audit records matching the read-only filter.
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditRecordList'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/security/audit-hash:
    x-service-owner: audit-service
    get:
      operationId: getAuditHash
      security: [{apiKeyAuth: []}]
      x-rate-limit: required
      parameters: [{name: contractId, in: query, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Current per-contract audit chain hash for External Verifier reconciliation.
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditHashResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/audit/contracts/{contractId}/records:
    x-service-owner: audit-service
    get:
      operationId: getContractAuditTrail
      x-roles: [BUYER, SELLER]
      description: >-
        D97 (24/11/2026). The evidence log of one contract for a party of it: every audit record whose subject is the
        contract, oldest first, with its recordHash. No link hashes and no record of another subject. The caller must be
        the buyer or seller named on the contract's CONTRACT_SIGNED record; otherwise, and when the contract has no
        audit record, 404 AUDIT_TRAIL_NOT_FOUND (the existence of another party's contract is not revealed). Reads are
        logged by the service, not written to the chain. The gateway routes /api/v1/audit/** to audit-service.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
      x-error-codes: [AUDIT_TRAIL_NOT_FOUND]
      responses:
        '200': {description: The contract's evidence log., content: {application/json: {schema: {$ref: '#/components/schemas/ContractAuditTrail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/audit/contracts/{contractId}/verification:
    x-service-owner: audit-service
    get:
      operationId: verifyContractAuditTrail
      x-roles: [BUYER, SELLER]
      description: >-
        D97. Recomputes every record hash of the contract's chain from its stored fields (hash-chain §3 formula) and
        checks each prevHashSubject against the record before it. Read-only; same party rule and 404 as the records.
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
      x-error-codes: [AUDIT_TRAIL_NOT_FOUND]
      responses:
        '200': {description: The verification result., content: {application/json: {schema: {$ref: '#/components/schemas/AuditChainVerification'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/audit/contracts/{contractId}/records:
    x-service-owner: audit-service
    get:
      operationId: getContractAuditTrailForAdmin
      x-roles: [ADMIN]
      description: >-
        D97. The contract's evidence log for ADMIN, oldest first, with both link hashes and the global sequence. Every
        successful call appends one AUDIT_VIEWED record (subject SYSTEM) before the response, in the same transaction:
