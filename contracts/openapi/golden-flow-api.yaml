      description: 'Always 200 for a well-formed userId; a user without facts returns {score: null, locked: false, lockHistory: []}. No 404 (reputation-service holds no user table; avoids probing which users were locked). Source reputation-service design 6.1b.'
  /internal/v1/reputation/public-summaries:
    x-service-owner: reputation-service
    post:
      x-internal: true
      operationId: getPublicReputationSummaries
      security: [{serviceAuth: []}]
      description: >-
        Batch read for product-service listing search (#265, #337, #338; reputation-service design 6.2).
        Never routed by the gateway; X-Gateway-Secret is not accepted. Returns exactly one item per
