      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReputationBatchSummaryRequest'}}}}
      responses:
        '200': {description: One summary per requested userId, content: {application/json: {schema: {$ref: '#/components/schemas/ReputationBatchSummaryResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/admin/reputation/actions/propose:
