        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
      x-error-codes: [AUDIT_TRAIL_NOT_FOUND]
      responses:
        '200': {description: The contract's evidence log with link hashes., content: {application/json: {schema: {$ref: '#/components/schemas/AdminContractAuditTrail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/audit/contracts/{contractId}/verification:
    x-service-owner: audit-service
    get:
      operationId: verifyContractAuditTrailForAdmin
      x-roles: [ADMIN]
      description: D97. Same check as the party verification; no AUDIT_VIEWED record (it reveals no content).
      parameters:
        - {name: contractId, in: path, required: true, schema: {type: string, format: uuid}}
      x-error-codes: [AUDIT_TRAIL_NOT_FOUND]
      responses:
        '200': {description: The verification result., content: {application/json: {schema: {$ref: '#/components/schemas/AuditChainVerification'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/audit/records:
    x-service-owner: audit-service
    get:
      operationId: listAuditRecordsForAdmin
      x-roles: [ADMIN]
      description: >-
        D97. The global chain for ADMIN, newest first (globalSeq descending), every subject (CONTRACT, USER_PAIR, SYSTEM),
        optionally one subject type. Every successful call appends one AUDIT_VIEWED record (subject SYSTEM, scope
        GLOBAL, the filter and page) in the same transaction.
      parameters:
        - {name: subjectType, in: query, required: false, schema: {enum: [CONTRACT, USER_PAIR, SYSTEM]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: One page of the global chain., content: {application/json: {schema: {$ref: '#/components/schemas/AdminAuditRecordPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/audit/verification:
    x-service-owner: audit-service
    get:
      operationId: verifyGlobalAuditChain
      x-roles: [ADMIN]
      description: >-
        D97. Walks the whole table in globalSeq order: recomputes every record hash and checks every prevHashGlobal
        against the record before it. The same check VerifyChainJob (#257) runs weekly. Read-only.
      responses:
        '200': {description: The verification result., content: {application/json: {schema: {$ref: '#/components/schemas/AuditChainVerification'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/security/emergency-lock:
    x-service-owner: bank-service
    post:
      operationId: emergencyLock
      description: External Verifier ES256 signed request. No JWT, API key, Admin bypass or Gateway retry; request cap 64 KB.
      security: []
      x-signed-action: LOCK
      x-error-codes: [EXTERNAL_SIGNATURE_INVALID, EXTERNAL_KEY_UNKNOWN, SIGNATURE_TIMESTAMP_OUT_OF_WINDOW, NONCE_REPLAYED, SYSTEM_ALREADY_LOCKED]
      x-max-body-bytes: 65536
      x-gateway-retry: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalVerifierRequest'}}}}
      responses:
        '204': {description: System lock activated.}
        '401': {$ref: '#/components/responses/ExternalSignatureInvalid'}
        '409': {$ref: '#/components/responses/SystemAlreadyLocked'}
  /api/v1/security/emergency-unlock:
    x-service-owner: bank-service
    post:
      operationId: emergencyUnlock
      description: External Verifier ES256 signed request. The signed action must be UNLOCK.
      security: []
      x-signed-action: UNLOCK
      x-error-codes: [EXTERNAL_SIGNATURE_INVALID, EXTERNAL_KEY_UNKNOWN, SIGNATURE_TIMESTAMP_OUT_OF_WINDOW, NONCE_REPLAYED, SYSTEM_NOT_LOCKED]
      x-max-body-bytes: 65536
      x-gateway-retry: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalVerifierRequest'}}}}
      responses:
        '204': {description: System lock released.}
        '401': {$ref: '#/components/responses/ExternalSignatureInvalid'}
        '409': {$ref: '#/components/responses/SystemNotLocked'}
  /api/v1/escrows/statements:
    x-service-owner: escrow-service
    get:
      operationId: exportEscrowStatement
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Participant-owned read-only ledger statement.
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /internal/v1/bank/ledger:
    x-service-owner: bank-service
    get:
      x-internal: true
      operationId: getInternalLedgerEntries
      security: [{serviceAuth: []}]
      description: >-
        Existing read-only ledger contract used for statements and terminal-money
        reconciliation. Callers must provide contractId or participantId. Contract-service
        filters by contractId and verifies the expected remedyDecisionId/remedyLegId set plus
        zero remaining lock before committing SETTLED or TERMINATED.
      x-validation: At least one of contractId or participantId is required; from/to are optional reconciliation bounds and must be supplied together when used.
      parameters:
        - {name: contractId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: participantId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: remedyDecisionId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Read-only ledger entries, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerEntryList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    serviceAuth: {type: apiKey, in: header, name: X-Internal-Secret, description: 'Service-to-service identity (SERVICE_INTERNAL_SECRET). The gateway never routes /internal/**, and X-Gateway-Secret is not accepted here. mTLS is the production evolution, out of Phase 2 scope.'}
    apiKeyAuth: {type: apiKey, in: header, name: X-Api-Key}
  schemas:
    CreateContractRequest:
      type: object
      required: [listingId, listingVersionToken, terms]
      additionalProperties: false
      x-validation: The authoritative Category.commodity resolved from listingId and terms.qualityTerms.commodity must both be COFFEE. The client cannot override goodsTerms. requestedQuantity is derived only as the sum of terms.milestoneSchedule committedQuantity. The exact opaque listingVersionToken is passed to product-service reserve; no independent quantity or client-owned inventory counter is accepted.
      properties:
        listingId: {type: string, format: uuid}
        listingVersionToken:
          type: string
          minLength: 1
          description: Opaque token returned by ListingResponse; Phase 2 backs it with canonical UTC Listing.updatedAt. A mismatch returns 409 LISTING_VERSION_MISMATCH and no contract is created or reserved.
        terms: {$ref: '#/components/schemas/ContractTermsInput'}
    ContractTermsBase:
      type: object
      required: [agreedPrice, currency, milestoneSchedule, qualityTerms, deliveryTerms, inspectionTerms, priceBand, priceAdjustmentRule, toleranceRate, shortfallPenaltyThreshold, buyerPenaltyRate, sellerPenaltyRate, forceMajeureReportWindowDays, buyerConfirmWindowDays, buyerDepositRate, disputeFloorReleaseRate, sellerDepositRate, legalProfile]
      x-invariant: buyerPenaltyRate and sellerPenaltyRate must each be less than or equal to legalProfile.maxContractualPenaltyRate; contract-service validates this cross-field invariant before signature.
      properties:
        agreedPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11, description: "Signed base unit price used when a milestone has no accepted bounded adjustment; technical maximum 99,999,999.99 VND/kg."}
        currency: {type: string, const: VND}
        milestoneSchedule:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/MilestoneTermRequest'}
          description: requestedQuantity is server-derived as the sum of committedQuantity across this array; the request has no separate quantity field.
        qualityTerms: {$ref: '#/components/schemas/QualityTerms'}
        deliveryTerms: {$ref: '#/components/schemas/DeliveryTerms'}
        inspectionTerms: {$ref: '#/components/schemas/InspectionTerms'}
        priceBand: {$ref: '#/components/schemas/PriceBand'}
        priceAdjustmentRule: {$ref: '#/components/schemas/PriceAdjustmentRule'}
        toleranceRate: {type: number, minimum: 0, maximum: 0.10}
        shortfallPenaltyThreshold: {type: number, minimum: 0.03, maximum: 0.15}
        buyerPenaltyRate: {type: number, minimum: 0, maximum: 1, description: Must be <= legalProfile.maxContractualPenaltyRate; 8% by default for VN_COMMERCIAL_LAW.}
        sellerPenaltyRate: {type: number, minimum: 0, maximum: 1, description: Must be <= legalProfile.maxContractualPenaltyRate; 8% by default for VN_COMMERCIAL_LAW.}
        forceMajeureReportWindowDays: {type: integer, minimum: 1, description: Calendar-day window anchored to the seller-known event timestamp and resolved in Asia/Ho_Chi_Minh.}
        buyerConfirmWindowDays: {type: integer, minimum: 2, maximum: 10, description: Vietnam business-day window calculated in Asia/Ho_Chi_Minh from entry into BUYER_RECEIVED.}
        fundingLeadBusinessDays: {type: integer, minimum: 3, maximum: 60, description: "Vietnam business days before each milestone's expectedDeliveryDate on which contract-service requests the batch lock (milestone.funding_requested). Negotiated per contract; floor 3 protects the seller, ceiling 60 only rejects unreasonable input. Same value for every milestone."}
        buyerDepositRate: {type: number, minimum: 0, maximum: 1, description: "Locked once at SIGNED against nominal totalContractValue and never recomputed from milestone price adjustments. Signed legacy snapshots outside the current negotiation band remain readable and operable."}
        disputeFloorReleaseRate: {type: number, minimum: 0.50, maximum: 1, description: Must not exceed 1 - level2SafetyBufferRate; service validates the cross-field guardrail.}
        sellerDepositRate: {type: number, minimum: 0, maximum: 1}
        level2InspectorOrg: {type: [string, 'null']}
        legalProfile: {$ref: '#/components/schemas/LegalProfile'}
    ContractTermsInput:
      description: Negotiated terms accepted by create/PATCH. goodsTerms and totalContractValue are server-derived and rejected if supplied.
      x-validation: qualityTerms.commodity and immutable goodsTerms.commodity must both be COFFEE; any other commodity is outside Phase 2 and rejected before signature.
      allOf:
        - {$ref: '#/components/schemas/ContractTermsBase'}
        - type: object
          properties:
            buyerDepositRate: {type: number, minimum: 0.03, maximum: 0.10, default: 0.05, description: "Negotiated per contract within the [3%, 10%] band for new create/PATCH input."}
            fundingLeadBusinessDays: {type: integer, minimum: 3, maximum: 60, default: 7, description: Omitted on create/PATCH means 7; the server stores the resolved value, so the snapshot always carries it.}
      unevaluatedProperties: false
    ContractTermsSnapshot:
      description: Full immutable terms returned by the server and canonicalized into signedContentHash.
      allOf:
        - {$ref: '#/components/schemas/ContractTermsBase'}
        - type: object
          required: [contractTemplateCode, contractTemplateVersion, contractTemplateHash, coffeeQualityProfileVersion, goodsTerms, totalContractValue, fundingLeadBusinessDays]
          properties:
            contractTemplateCode: {type: string, const: VN_COFFEE_B2B, readOnly: true}
            contractTemplateVersion: {type: string, minLength: 1, readOnly: true}
            contractTemplateHash: {type: string, pattern: '^[a-f0-9]{64}$', readOnly: true}
            coffeeQualityProfileVersion: {type: string, minLength: 1, readOnly: true, description: Versioned internal coffee-quality profile; no external ISO/TCVN claim is implied.}
            goodsTerms: {$ref: '#/components/schemas/GoodsTermsSnapshot'}
            totalContractValue:
              type: string
              pattern: '^[0-9]+\.[0-9]{2}$'
              maxLength: 19
              readOnly: true
              description: Server-derived agreedPrice multiplied by total committed quantity, rounded once to the whole dong HALF_UP (D65); deposits always use this nominal value and are rounded the same way. Technical maximum 9,999,999,999,999,999.99 VND.
      unevaluatedProperties: false
    LegalProfile:
      type: object
      required: [governingLaw, contractType, maxContractualPenaltyRate, damagesPolicy]
      additionalProperties: false
      properties:
        governingLaw: {enum: [VN_COMMERCIAL_LAW, VN_CIVIL_LAW]}
        contractType: {type: string, minLength: 1}
        maxContractualPenaltyRate: {type: number, minimum: 0, maximum: 1, description: Derived snapshot; defaults to 0.08 for VN_COMMERCIAL_LAW.}
        damagesPolicy: {enum: [COMMERCIAL_CUMULATIVE_IF_PROVEN, CIVIL_PENALTY_ONLY_UNLESS_EXPRESSLY_CUMULATIVE, EXPRESS_PENALTY_ONLY]}
    MilestoneTermRequest:
      type: object
      required: [milestoneIndex, committedQuantity, expectedDeliveryDate, graceDays]
      additionalProperties: false
      properties:
        milestoneIndex: {type: integer, minimum: 1}
        committedQuantity: {type: number, exclusiveMinimum: 0, maximum: 1000000, description: "Committed quantity in canonical kilograms (kg); technical maximum 1,000,000 kg per milestone."}
        expectedDeliveryDate: {type: string, format: date, description: Signed date-only delivery target; expires at 23:59:59.999 Asia/Ho_Chi_Minh on this date.}
        graceDays: {type: integer, minimum: 0, description: Additional Vietnam business days after expectedDeliveryDate; the resulting date expires at 23:59:59.999 Asia/Ho_Chi_Minh.}
    PlotRefSnapshot:
      type: object
      required: [registryEntryId, householdLabel, geometryType, geometryHash, verificationLevel]
      additionalProperties: false
      properties:
        registryEntryId: {type: string, format: uuid}
        householdLabel: {type: string, minLength: 1}
        geometryType: {enum: [POINT, POLYGON]}
        geometryHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        verificationLevel: {enum: [SELF_DECLARED, CADASTRAL_BACKED]}
    PlotBackedOriginSnapshot:
      type: object
      required: [regionText, plotRefs]
      additionalProperties: false
      properties:
        regionText: {type: string, minLength: 1}
        plotRefs: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PlotRefSnapshot'}}
    RegionOnlyOriginSnapshot:
      type: object
      required: [regionText, plotRefs]
      additionalProperties: false
      properties:
        regionText: {type: string, minLength: 1}
        plotRefs: {type: array, maxItems: 0, items: {$ref: '#/components/schemas/PlotRefSnapshot'}}
    TraceabilitySnapshot:
      type: object
      required: [evidencePackageId, packageHash]
      additionalProperties: false
      properties:
        evidencePackageId: {type: string, format: uuid}
        packageHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    GoodsTermsCommon:
      type: object
      required: [commodity, listingId, productId, categoryId, categoryName, productName, unitOfMeasure, cropYear, harvestSeason, originSnapshot]
      properties:
        commodity: {const: COFFEE}
        listingId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        categoryName: {type: string, minLength: 1}
        productName: {type: string, minLength: 1}
        unitOfMeasure: {type: string, const: KG}
        cropYear: {type: [integer, 'null'], readOnly: true, description: Server-derived Product crop year frozen into the signed goods snapshot.}
        harvestSeason: {type: [string, 'null'], readOnly: true, description: Server-derived Product harvest season frozen into the signed goods snapshot.}
    CoffeeGoodsTerms:
      allOf:
        - {$ref: '#/components/schemas/GoodsTermsCommon'}
        - type: object
          properties:
            commodity: {const: COFFEE}
            originSnapshot: {$ref: '#/components/schemas/PlotBackedOriginSnapshot'}
            traceabilitySnapshot:
              oneOf: [{$ref: '#/components/schemas/TraceabilitySnapshot'}, {type: 'null'}]
      unevaluatedProperties: false
    GoodsTermsSnapshot:
      $ref: '#/components/schemas/CoffeeGoodsTerms'
    CoffeeQualitySpec:
      type: object
      required: [commodity, type, moisturePercent, foreignMatterPercent, blackBrokenBeansPercent]
      additionalProperties: false
      properties:
        commodity: {const: COFFEE}
        type: {enum: [ARABICA, ROBUSTA]}
        moisturePercent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01}
        foreignMatterPercent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01}
        blackBrokenBeansPercent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01}
      example: {commodity: COFFEE, type: ROBUSTA, moisturePercent: 12.5, foreignMatterPercent: 0.5, blackBrokenBeansPercent: 5.0}
    NumericDeviationPolicy:
      type: object
      required: [direction, tolerance, penalty, reject, discountRate]
      additionalProperties: false
      properties:
        direction: {enum: [MAXIMUM, MINIMUM]}
        tolerance: {type: number, minimum: 0}
        penalty: {type: number, minimum: 0}
        reject: {type: number, minimum: 0}
        discountRate: {type: number, minimum: 0, maximum: 1}
      x-invariant: tolerance must be less than or equal to penalty, and penalty must be less than reject.
    ExactMatchRejectPolicy:
      type: object
      required: [rejectOnMismatch]
      additionalProperties: false
      properties:
        rejectOnMismatch: {const: true}
    CoffeeQualityDeviationPolicy:
      type: object
      required: [type, moisturePercent, foreignMatterPercent, blackBrokenBeansPercent]
      additionalProperties: false
      properties:
        type: {$ref: '#/components/schemas/ExactMatchRejectPolicy'}
        moisturePercent: {$ref: '#/components/schemas/NumericDeviationPolicy'}
        foreignMatterPercent: {$ref: '#/components/schemas/NumericDeviationPolicy'}
        blackBrokenBeansPercent: {$ref: '#/components/schemas/NumericDeviationPolicy'}
    CoffeeQualityTerms:
      type: object
      required: [commodity, committedSpec, deviationPolicy]
      additionalProperties: false
      properties:
        commodity: {const: COFFEE}
        committedSpec: {$ref: '#/components/schemas/CoffeeQualitySpec'}
        deviationPolicy: {$ref: '#/components/schemas/CoffeeQualityDeviationPolicy'}
    QualityTerms:
      $ref: '#/components/schemas/CoffeeQualityTerms'
    DeliveryTerms:
      type: object
      required: [deliveryResponsibility, riskTransferPoint, titleTransferPoint, transportCostBearer, unloadingCostBearer]
      additionalProperties: false
      properties:
        deliveryResponsibility: {enum: [SELLER_DELIVERS, BUYER_COLLECTS]}
        riskTransferPoint: {enum: [SELLER_DISPATCH, BUYER_RECEIPT, BUYER_ACCEPTANCE]}
        titleTransferPoint: {enum: [FULL_PAYMENT, BUYER_RECEIPT, BUYER_ACCEPTANCE]}
        transportCostBearer: {enum: [BUYER, SELLER, SHARED]}
        unloadingCostBearer: {enum: [BUYER, SELLER, SHARED]}
      description: Signed allocation rules only; runtime addresses and carriers are intentionally excluded.
    InspectionTerms:
      type: object
      required: [requirement, requiredTier, reportDueBusinessDays, inspectionCostResponsibility]
      additionalProperties: false
      properties:
        requirement: {enum: [NONE_UNLESS_DISPUTED, MANDATORY_BEFORE_SETTLEMENT]}
        requiredTier: {enum: [LEVEL_1_5, LEVEL_2]}
        reportDueBusinessDays: {type: integer, minimum: 1, maximum: 30}
        inspectionCostResponsibility: {const: LOSER_PAYS, description: The only Phase 2 policy; final allocation follows the quality disposition rather than requestedBy.}
      x-invariant: level2InspectorOrg must be non-null when requiredTier is LEVEL_2.
    PriceBand:
      type: object
      required: [minimumUnitPrice, maximumUnitPrice]
      additionalProperties: false
      properties:
        minimumUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
        maximumUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
      x-invariant: minimumUnitPrice <= agreedPrice <= maximumUnitPrice.
    PriceAdjustmentRule:
      type: object
      required: [acceptanceMode, cutoff, maximumAcceptedAdjustmentsPerMilestone]
      additionalProperties: false
      properties:
        acceptanceMode: {const: BOTH_ACCEPT}
        cutoff: {const: BEFORE_FUNDING_REQUEST}
        maximumAcceptedAdjustmentsPerMilestone: {const: 1}
    ContractResponse:
      type: object
      required: [contractId, listingId, reservedQuantity, buyerId, sellerId, status, terms, signedContentHash, milestones]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        listingId: {type: string, format: uuid}
        reservedQuantity: {type: number, exclusiveMinimum: 0, readOnly: true, description: Product-service reservation snapshot in canonical kilograms (kg); must equal the sum of milestone committedQuantity before SIGNED. Contract-service never treats this as an inventory counter.}
        buyerId: {type: string, format: uuid}
        sellerId: {type: string, format: uuid}
        status: {enum: [OFFERED, NEGOTIATING, SIGNED, ACTIVE, REPLACEMENT_PENDING, SUPERSEDE_REFUND_PENDING, ACTIVATION_REFUND_PENDING, SETTLED, TERMINATED, WITHDRAWN, SUPERSEDED, ACTIVATION_FAILED]}
        terms: {$ref: '#/components/schemas/ContractTermsSnapshot'}
        signedContentHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        milestones:
          type: array
          items: {$ref: '#/components/schemas/MilestoneResponse'}
        activationRecovery:
          description: Present only after escrow.deposit_lock_failed was received for this contract.
          type: object
          required: [depositLockFailedAt, oneSidedCancelAllowedFrom, cancelRequestedBy]
          additionalProperties: false
          properties:
            depositLockFailedAt: {type: string, format: date-time, description: First escrow.deposit_lock_failed of the contract (UTC).}
            oneSidedCancelAllowedFrom: {type: string, format: date-time, description: depositLockFailedAt + 5 business days; from then one party's request is enough. Never moved by RetryDepositLock.}
            cancelRequestedBy: {type: array, uniqueItems: true, maxItems: 2, items: {enum: [BUYER, SELLER]}}
    MilestoneResponse:
      type: object
      required: [milestoneId, milestoneIndex, status, fundingStatus, fundingScheduledDate, committedQuantity, batchAmount, effectiveUnitPrice, acceptedPriceAdjustment, expectedDeliveryDate, graceDays, fundingDelayBusinessDays, effectiveDeliveryDeadline]
      additionalProperties: false
      properties:
        milestoneId: {type: string, format: uuid}
        milestoneIndex: {type: integer, minimum: 1}
        status: {enum: [CREATED, IN_PROGRESS, SELLER_WEIGHED, BUYER_RECEIVED, AWAITING_SELLER_RESPONSE, CONTESTED, FORCE_MAJEURE_PENDING_REVIEW, SETTLED], description: CREATED until escrow.milestone_funded; the seller has no delivery obligation before IN_PROGRESS.}
        fundingStatus: {enum: [NOT_REQUESTED, FUNDING_PENDING, LOCKED, FUNDING_FAILED], description: NOT_REQUESTED before fundingScheduledDate; FUNDING_PENDING once milestone.funding_requested is emitted.}
        fundingScheduledDate: {type: string, format: date, description: Vietnam business day that is fundingLeadBusinessDays before expectedDeliveryDate; the request goes out on that day, or at activation when the contract becomes ACTIVE later.}
        committedQuantity: {type: number, exclusiveMinimum: 0, maximum: 1000000, description: "Committed quantity in canonical kilograms (kg); technical maximum 1,000,000 kg per milestone."}
        batchAmount:
          oneOf:
            - {type: string, pattern: '^[0-9]+\.00$', maxLength: 19}
            - {type: 'null'}
          description: "null while fundingStatus is NOT_REQUESTED, because an accepted price adjustment can still change it. Fixed when milestone.funding_requested is emitted: committedQuantity multiplied by effectiveUnitPrice, rounded once to the whole dong HALF_UP. Technical maximum 9,999,999,999,999,999.00 VND."
        effectiveUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
        acceptedPriceAdjustment:
          oneOf: [{$ref: '#/components/schemas/AcceptedPriceAdjustment'}, {type: 'null'}]
        expectedDeliveryDate: {type: string, format: date, description: Signed date-only target; expires at 23:59:59.999 Asia/Ho_Chi_Minh.}
        graceDays: {type: integer, minimum: 0, description: Vietnam business-day grace period.}
        fundingDelayBusinessDays: {type: integer, minimum: 0, description: "Vietnam business days from milestone.funding_requested requestedAt to escrow.milestone_funded lockedAt, Monday-Friday national-holiday calendar; 0 until funded. Applies to every milestone, milestone 1 included."}
        effectiveDeliveryDeadline: {type: string, format: date, description: expectedDeliveryDate plus fundingDelayBusinessDays plus graceDays; expires at 23:59:59.999 Asia/Ho_Chi_Minh.}
    PriceAdjustmentProposalRequest:
      type: object
      required: [proposedUnitPrice]
      additionalProperties: false
      properties:
        proposedUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11, description: "Must be within the signed inclusive price band and the technical maximum 99,999,999.99 VND/kg."}
    PendingPriceAdjustment:
      type: object
      required: [proposalId, contractId, milestoneId, proposedUnitPrice, currency, proposerId, proposedAt, status]
      additionalProperties: false
      properties:
        proposalId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        milestoneId: {type: string, format: uuid}
        proposedUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
        currency: {const: VND}
        proposerId: {type: string, format: uuid}
        proposedAt: {type: string, format: date-time}
        status: {const: PENDING}
    AcceptedPriceAdjustment:
      type: object
      required: [adjustmentId, proposalId, contractId, milestoneId, baseUnitPrice, effectiveUnitPrice, currency, proposerId, accepterId, proposedAt, acceptedAt]
      additionalProperties: false
      properties:
        adjustmentId: {type: string, format: uuid}
        proposalId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        milestoneId: {type: string, format: uuid}
        baseUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
        effectiveUnitPrice: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11}
        currency: {const: VND}
        proposerId: {type: string, format: uuid}
        accepterId: {type: string, format: uuid}
        proposedAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time}
    BreachCase:
      type: object
      required: [breachCaseId, contractId, milestoneId, requestedBy, allegedBreachingRole, breachReasonCode, severity, evidenceFileIds, finalBreachingRole, decisionSource, status, contestStatus, contestDeadline, computedResolution, reportedAt, resolvedAt]
      additionalProperties: false
      properties:
        breachCaseId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        milestoneId: {type: [string, 'null'], format: uuid}
        requestedBy: {enum: [BUYER, SELLER, SYSTEM]}
        allegedBreachingRole:
          oneOf: [{enum: [BUYER, SELLER]}, {type: 'null'}]
        breachReasonCode: {$ref: '#/components/schemas/BreachReasonCode'}
        severity: {enum: [MINOR, MATERIAL]}
        evidenceFileIds: {type: array, items: {type: string, format: uuid}}
        finalBreachingRole:
          oneOf: [{enum: [BUYER, SELLER]}, {type: 'null'}]
        decisionSource:
          oneOf: [{enum: [ARBITRATOR, INSPECTOR_L1_5, INSPECTOR_L2, MUTUAL]}, {type: 'null'}]
        status: {enum: [REPORTED, UNDER_REVIEW, RESOLVED]}
        reportedAt: {type: string, format: date-time, description: D84; the Arbitrator queue sorts by it.}
        resolvedAt: {type: [string, 'null'], format: date-time}
        contestStatus:
          enum: [NOT_APPLICABLE, OPEN, CONTESTED, EXPIRED]
          description: NOT_APPLICABLE before RESOLVED, for no-fault or refund/release-only decisions, and for contract-level cases (milestoneId null); OPEN until contestDeadline. Milestone-escrow design 6.4.
        contestDeadline:
          type: [string, 'null']
          format: date-time
          description: resolvedAt + 2 business days (ICT); null unless contestStatus has been OPEN.
        computedResolution:
          oneOf: [{$ref: '#/components/schemas/BreachCaseComputedResolution'}, {type: 'null'}]
          description: D81. Deterministic result computed from the confirmed Level 1.5 report of a contested milestone; null until the report is confirmed and for cases without a report.
    BreachCaseComputedResolution:
      type: object
      required: [inspectionReportId, issueType, acceptedQuantityKg, qualityDisposition, finalBreachingRole, decisionSource, sellerEntitlementAmount, buyerRefundAmount, prevailingRole]
      additionalProperties: false
      properties:
        inspectionReportId: {type: string, format: uuid}
        issueType: {enum: [QUANTITY, QUALITY]}
        acceptedQuantityKg: {type: number, minimum: 0}
        qualityDisposition:
          oneOf: [{enum: [CONFORMING, PARTIALLY_CONFORMING, NON_CONFORMING]}, {type: 'null'}]
          description: null for issueType QUANTITY (D83).
        finalBreachingRole:
          oneOf: [{enum: [SELLER]}, {type: 'null'}]
          description: SELLER only for NON_CONFORMING; null for QUANTITY (D83) and for CONFORMING/PARTIALLY_CONFORMING.
        decisionSource: {const: INSPECTOR_L1_5}
        sellerEntitlementAmount: {type: string, pattern: '^[0-9]+\.00$', maxLength: 19, description: "VND, whole dong (D65), decimal string like every other money field (D84); sellerEntitlementAmount + buyerRefundAmount = lockedAmount."}
        buyerRefundAmount: {type: string, pattern: '^[0-9]+\.00$', maxLength: 19}
        prevailingRole:
          enum: [BUYER, SELLER]
          description: "D83 for QUANTITY: the side whose weight is closer to acceptedQuantityKg, SELLER on a tie. For QUALITY: SELLER for CONFORMING, BUYER otherwise. The other side bears the inspection cost (recorded on the RemedyDecision only)."
    ReplacementProposalRequest:
      type: object
      required: [listingId, terms]
      additionalProperties: false
      properties:
        listingId: {type: string, format: uuid}
        terms: {$ref: '#/components/schemas/ContractTermsInput'}
    BreachCaseReportRequest:
      type: object
      required: [milestoneId, allegedBreachingRole, breachReasonCode, severity, evidenceFileIds]
      additionalProperties: false
      properties:
        milestoneId: {type: [string, 'null'], format: uuid}
        allegedBreachingRole: {enum: [BUYER, SELLER]}
        breachReasonCode: {$ref: '#/components/schemas/BreachReasonCode'}
        severity: {enum: [MINOR, MATERIAL]}
        evidenceFileIds: {type: array, items: {type: string, format: uuid}}
    BreachContestRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000, description: Why the contesting party disagrees (D91).}
        evidenceFileIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Optional READY files uploaded by the caller; more can be added later (D91).
    BreachContestEvidenceRequest:
      type: object
      required: [fileIds]
      additionalProperties: false
      properties:
        fileIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
    BreachCaseResolutionRequest:
      type: object
      required: [finalBreachingRole, decisionSource, evidenceRefs]
      additionalProperties: false
      properties:
        finalBreachingRole:
          oneOf: [{enum: [BUYER, SELLER]}, {type: 'null'}]
        decisionSource: {enum: [ARBITRATOR, INSPECTOR_L1_5, INSPECTOR_L2, MUTUAL]}
        evidenceRefs: {type: array, items: {type: string}}
    TerminationExecuteRequest:
      type: object
      required: [terminationType, attributionDecisionId]
      additionalProperties: false
      properties:
        terminationType: {enum: [MUTUAL_TERMINATION, MUTUAL_REPLACEMENT, TERMINATION_FOR_BREACH, TERMINATION_FOR_FORCE_MAJEURE, ACTIVATION_FAILURE]}
        attributionDecisionId: {type: string, format: uuid}
        breachCaseId: {type: [string, 'null'], format: uuid}
    ReputationBatchSummaryRequest:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
    ReputationBatchSummaryItem:
      type: object
      required: [userId, score, locked]
      additionalProperties: false
      properties:
        userId: {type: string, format: uuid}
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Same value as ReputationPublicSummary.score for this user.
        locked: {type: boolean, description: Same value as ReputationPublicSummary.locked (effective lock).}
    ReputationBatchSummaryResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReputationBatchSummaryItem'}}
    ReputationPublicSummary:
      type: object
      required: [userId, score, locked, lockHistory]
      additionalProperties: false
      properties:
        userId: {type: string, format: uuid}
        score:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: null when the user has no completed-contract or lock facts; otherwise round(100 * completed / (completed + locks)). Reputation-service design 6.1b.
        locked: {type: boolean}
        lockHistory:
          type: array
          description: Newest first. No contractId, remedyDecisionId, multipliers or override reasons.
          items:
            type: object
            required: [lockedAt, lockedUntil, lockDurationDays, penalizedRole, status]
            additionalProperties: false
            properties:
              lockedAt: {type: string, format: date-time}
              lockedUntil: {type: string, format: date-time}
              lockDurationDays: {type: integer, minimum: 1}
              penalizedRole: {enum: [BUYER, SELLER]}
              status: {enum: [ACTIVE, EXPIRED, UNLOCKED_EARLY]}
    ReputationActionProposalRequest:
      type: object
      required: [actionType, targetUserId, reason]
      additionalProperties: false
      properties:
        actionType: {enum: [UNLOCK_EARLY, CLEAR_ELEVATED_RISK]}
        targetUserId: {type: string, format: uuid}
        reason: {type: string, minLength: 1}
    ReputationAction:
      type: object
      required: [actionId, actionType, targetUserId, proposedBy, status]
      additionalProperties: false
      properties:
        actionId: {type: string, format: uuid}
        actionType: {enum: [UNLOCK_EARLY, CLEAR_ELEVATED_RISK]}
        targetUserId: {type: string, format: uuid}
        proposedBy: {type: string, format: uuid}
        status: {enum: [PROPOSED, APPROVED, REJECTED]}
    AttributionDecision:
      type: object
      required: [attributionDecisionId, breachCaseId, decisionSource, finalBreachingRole, breachReasonCode, qualityDisposition, evidenceRefs]
      additionalProperties: false
      allOf:
        - if:
            properties: {qualityDisposition: {enum: [CONFORMING, PARTIALLY_CONFORMING]}}
            required: [qualityDisposition]
          then:
            properties:
              finalBreachingRole: {type: 'null'}
              breachReasonCode: {type: 'null'}
        - if:
            properties: {qualityDisposition: {const: NON_CONFORMING}}
            required: [qualityDisposition]
          then:
            properties:
              finalBreachingRole: {const: SELLER}
              breachReasonCode: {const: QUALITY_BELOW_COMMITTED}
      properties:
        attributionDecisionId: {type: string, format: uuid}
        breachCaseId: {type: [string, 'null'], format: uuid}
        decisionSource: {enum: [SYSTEM, ARBITRATOR, INSPECTOR_L1_5, INSPECTOR_L2, MUTUAL]}
        finalBreachingRole:
          oneOf: [{enum: [BUYER, SELLER]}, {type: 'null'}]
        breachReasonCode: {$ref: '#/components/schemas/NullableBreachReasonCode'}
        qualityDisposition:
          oneOf: [{enum: [CONFORMING, PARTIALLY_CONFORMING, NON_CONFORMING]}, {type: 'null'}]
        evidenceRefs: {type: array, items: {type: string}}
    RemedyDecision:
      type: object
      required: [remedyDecisionId, attributionDecisionId, breachCaseId, contractId, buyerId, sellerId, affectedMilestoneIds, finalBreachingRole, breachReasonCode, qualityDisposition, decisionSource, penaltyEligible, reputationEligible, remedyLegs]
      additionalProperties: false
      allOf:
        - if:
            properties: {finalBreachingRole: {type: 'null'}}
            required: [finalBreachingRole]
          then:
            properties:
              penaltyEligible: {const: false}
              reputationEligible: {const: false}
              remedyLegs:
                items:
                  properties:
                    remedyType: {enum: [NONE, PAYMENT_SETTLEMENT, PAYMENT_REFUND]}
        - if:
            properties: {penaltyEligible: {const: false}}
            required: [penaltyEligible]
          then:
            properties:
              remedyLegs:
                items:
                  properties:
                    remedyType: {not: {const: CONTRACTUAL_PENALTY}}
        - if:
            properties: {qualityDisposition: {enum: [CONFORMING, PARTIALLY_CONFORMING]}}
            required: [qualityDisposition]
          then:
            properties:
              finalBreachingRole: {type: 'null'}
              breachReasonCode: {type: 'null'}
              penaltyEligible: {const: false}
              reputationEligible: {const: false}
        - if:
            properties: {qualityDisposition: {const: NON_CONFORMING}}
            required: [qualityDisposition]
          then:
            properties:
              finalBreachingRole: {const: SELLER}
              breachReasonCode: {const: QUALITY_BELOW_COMMITTED}
              penaltyEligible: {const: true}
              reputationEligible: {const: true}
      properties:
        remedyDecisionId: {type: string, format: uuid}
        attributionDecisionId: {type: string, format: uuid}
        breachCaseId: {type: [string, 'null'], format: uuid}
        contractId: {type: string, format: uuid}
        buyerId: {type: string, format: uuid}
        sellerId: {type: string, format: uuid}
        affectedMilestoneIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        finalBreachingRole:
          oneOf: [{enum: [BUYER, SELLER]}, {type: 'null'}]
        breachReasonCode: {$ref: '#/components/schemas/NullableBreachReasonCode'}
        qualityDisposition:
          oneOf: [{enum: [CONFORMING, PARTIALLY_CONFORMING, NON_CONFORMING]}, {type: 'null'}]
        decisionSource: {enum: [SYSTEM, ARBITRATOR, INSPECTOR_L1_5, INSPECTOR_L2, MUTUAL]}
        penaltyEligible: {type: boolean}
        reputationEligible: {type: boolean}
        remedyLegs: {type: array, items: {$ref: '#/components/schemas/RemedyLeg'}}
    RemedyLeg:
      type: object
      required: [remedyLegId, remedyType, fundType, role, amount]
      additionalProperties: false
      properties:
        remedyLegId: {type: string, format: uuid}
        remedyType: {enum: [NONE, PAYMENT_SETTLEMENT, PAYMENT_REFUND, DEPOSIT_FORFEITURE, CONTRACTUAL_PENALTY, DAMAGES_COMPENSATION]}
        fundType: {enum: [BUYER_DEPOSIT, SELLER_DEPOSIT, MILESTONE_PAYMENT]}
        role: {enum: [BUYER, SELLER]}
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19}
    BreachReasonCode:
      enum: [NON_DELIVERY, SHORTFALL, LATE_DELIVERY, QUALITY_BELOW_COMMITTED, SIDE_SELLING, PRODUCTION_SHOCK_NON_FM, FUNDING_FAILURE, LATE_PAYMENT, FAILURE_TO_RECEIVE, WRONGFUL_REJECTION, FORCE_MAJEURE, MUTUAL_EXIT, ACTIVATION_FAILURE]
    NullableBreachReasonCode:
      oneOf:
        - {$ref: '#/components/schemas/BreachReasonCode'}
        - {type: 'null'}
    ContractPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ContractResponse'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    PublicUserResponse:
      type: object
      required: [userId, organizationName, role, verificationStatus]
      additionalProperties: false
      properties:
        userId: {type: string}
        organizationName: {type: string}
        role: {enum: [BUYER, SELLER, ADMIN, INSPECTOR, OPERATOR, ARBITRATOR]}
        verificationStatus: {enum: [PENDING, VERIFIED, REJECTED]}
    EligibleInspectorList:
      type: array
      items:
        type: object
        required: [userId]
        additionalProperties: false
        properties:
          userId: {type: string}
    VerifyUserRequest:
      type: object
      required: [authorizationExpiresAt]
      description: The key is mandatory; send explicit null only for an open-ended authorization. A missing key is 400, never an implicit unlimited grant (user-service design 4.2).
      properties: {authorizationExpiresAt: {type: [string, 'null'], format: date-time, description: UTC instant; a date-only source document expires at 23:59:59.999 Asia/Ho_Chi_Minh on that date.}}
      additionalProperties: false
    RejectUserRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 1}}
      additionalProperties: false
    AssignUserRoleRequest:
      type: object
      required: [role]
      properties: {role: {enum: [BUYER, SELLER, ADMIN, INSPECTOR, OPERATOR, ARBITRATOR]}}
      additionalProperties: false
    OtpEmailRequest:
      type: object
      required: [requestId, recipientUserId, recipientEmail, otpCode, expiresAt]
      description: >-
        contractId and signedContentHash are required for the contract purposes (SIGN_CONTRACT, CANCEL_ACTIVATION,
        CONCEDE_DISPUTE, SETTLE_DISPUTE, or purpose absent) and must be absent for VERIFY_EMAIL (#344).
      properties:
        requestId: {type: string}
        recipientUserId: {type: string}
        recipientEmail: {type: string, format: email}
        contractId: {type: string}
        otpCode: {type: string, pattern: '^[0-9]{6}$'}
        signedContentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        expiresAt: {type: string, format: date-time, description: UTC OTP expiry instant derived from the owner service system timestamp.}
        purpose: {enum: [SIGN_CONTRACT, CANCEL_ACTIVATION, VERIFY_EMAIL, CONCEDE_DISPUTE, SETTLE_DISPUTE], default: SIGN_CONTRACT, description: 'Which action the code confirms; selects the email template. Absent means SIGN_CONTRACT. VERIFY_EMAIL (#344) is sent by user-service to prove the register email. CONCEDE_DISPUTE and SETTLE_DISPUTE (D57) confirm ending a milestone dispute.'}
      if:
        required: [purpose]
        properties: {purpose: {const: VERIFY_EMAIL}}
      then:
        not: {anyOf: [{required: [contractId]}, {required: [signedContentHash]}]}
      else:
        required: [contractId, signedContentHash]
      additionalProperties: false
    InitiateSignRequest:
      type: object
      required: [signerRole, consentStatementVersion, presentedContentHash]
      properties:
        signerRole: {enum: [BUYER, SELLER]}
        consentStatementVersion: {type: string, minLength: 1, description: Active server-owned SIGN_CONTRACT checkbox statement version displayed to the signer.}
        presentedContentHash: {type: string, pattern: '^[a-f0-9]{64}$', description: Hash displayed to the signer; server must require equality with the current signedContentHash before creating an OTP challenge.}
      additionalProperties: false
    ConsentInput:
      type: object
      required: [statementVersion, presentedContentHash]
      additionalProperties: false
      properties:
        statementVersion: {type: string, minLength: 1}
        presentedContentHash: {type: string, pattern: '^[a-f0-9]{64}$', description: "Current server-verifiable hash of the action subject/content shown with the checkbox. Milestone actions: recipe in milestone-escrow design §3.2.3 (D84)."}
    InitiateSignResponse:
      type: object
      required: [otpId, expiresAt]
      properties:
        otpId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time, description: UTC OTP expiry instant; client clock and timezone are not authoritative.}
      additionalProperties: false
    InitiateActivationCancelRequest:
      type: object
      required: [requesterRole, consentStatementVersion, presentedContentHash]
      properties:
        requesterRole: {enum: [BUYER, SELLER]}
        consentStatementVersion: {type: string, minLength: 1, description: Active server-owned CANCEL_ACTIVATION checkbox statement version displayed to the party.}
        presentedContentHash: {type: string, pattern: '^[a-f0-9]{64}$', description: signedContentHash displayed to the party; must equal the contract's.}
      additionalProperties: false
    InitiateDisputeConcessionRequest:
      type: object
      required: [consentStatementVersion, presentedContentHash]
      properties:
        consentStatementVersion: {type: string, minLength: 1, description: Active server-owned CONCEDE_DISPUTE checkbox statement version displayed to the party, stating the accepted amount and its consequences.}
        presentedContentHash: {type: string, pattern: '^[a-f0-9]{64}$', description: signedContentHash displayed to the party; must equal the contract's.}
      additionalProperties: false
    InitiateDisputeSettlementRequest:
      type: object
      required: [agreedSellerEntitlementAmount, consentStatementVersion, presentedContentHash]
      properties:
        agreedSellerEntitlementAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19, description: 'Seller entitlement for the milestone in VND; the rest of the locked batch amount is refunded to the buyer. Must lie within [buyer position, seller position].'}
        consentStatementVersion: {type: string, minLength: 1, description: Active server-owned SETTLE_DISPUTE checkbox statement version displayed to the party.}
        presentedContentHash: {type: string, pattern: '^[a-f0-9]{64}$', description: signedContentHash displayed to the party; must equal the contract's.}
      additionalProperties: false
    VerifyOtpAndSignRequest:
      type: object
      required: [otpId, otpCode]
      properties:
        otpId: {type: string, format: uuid}
        otpCode: {type: string, pattern: '^[0-9]{6}$'}
      additionalProperties: false
    SellerWeighedRequest:
      type: object
      required: [sellerDeclaredWeight, sellerEvidenceFileId, consent]
      properties:
        sellerDeclaredWeight: {type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001, description: "Seller-declared loaded weight in canonical kilograms (kg), the real weighed figure even above committedQuantity (D72): entitlement stays capped at the locked batch amount."}
        sellerEvidenceFileId: {type: string, format: uuid, description: Weighing photo uploaded by this seller for this milestone through uploadMilestoneEvidence (D71).}
        deliveryCertificateFileId: {type: string, format: uuid, description: Optional batch certificate used only as delivery/dispute evidence; never parsed as actual quality metrics. Uploaded the same way as sellerEvidenceFileId and different from it.}
        consent: {$ref: '#/components/schemas/ConsentInput'}
      additionalProperties: false
    MilestoneDetailResponse:
      type: object
      required: [contractId, milestone, sellerDeclaration, buyerReceipt, flag, evidence, settlement, breachCaseId, disputeExit]
      additionalProperties: false
      description: D84. Read model for the BF-04 screens; nested blocks are null until their step has happened.
      properties:
        contractId: {type: string, format: uuid}
        milestone: {$ref: '#/components/schemas/MilestoneResponse'}
        sellerDeclaration:
          oneOf: [{$ref: '#/components/schemas/MilestoneSellerDeclarationView'}, {type: 'null'}]
        buyerReceipt:
          oneOf: [{$ref: '#/components/schemas/MilestoneBuyerReceiptView'}, {type: 'null'}]
        flag:
          oneOf: [{$ref: '#/components/schemas/MilestoneFlagView'}, {type: 'null'}]
        evidence:
          type: array
          description: Every file uploaded for this milestone, oldest first, with the scan status contract-service knows.
          items: {$ref: '#/components/schemas/MilestoneEvidenceView'}
        settlement:
          oneOf: [{$ref: '#/components/schemas/MilestoneSettlementView'}, {type: 'null'}]
        breachCaseId: {type: [string, 'null'], format: uuid, description: The milestone's breach case opened by a contest (D80); null otherwise.}
        disputeExit:
          oneOf: [{$ref: '#/components/schemas/MilestoneDisputeExitView'}, {type: 'null'}]
          description: D92. Present while the milestone is at a moment where a concession or a settlement can end the dispute (milestone-escrow 3.4); null otherwise.
    MilestoneDisputeExitView:
      type: object
      required: [buyerPositionAmount, sellerPositionAmount, concedeAllowed, settlementAllowed, openProposal]
      additionalProperties: false
      description: D92. Server-computed positions (milestone-escrow 3.4 table) bounding a settlement, both ends included; the FE fills the CONCEDE_DISPUTE and SETTLE_DISPUTE statements from them.
      properties:
        buyerPositionAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', description: Seller entitlement in VND under the buyer's position (lower bound).}
        sellerPositionAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', description: Seller entitlement in VND under the seller's position (upper bound).}
        concedeAllowed: {type: boolean}
        settlementAllowed: {type: boolean, description: False while the flag waits for the seller's response.}
        openProposal:
          oneOf: [{$ref: '#/components/schemas/MilestoneSettlementProposalView'}, {type: 'null'}]
    MilestoneSettlementProposalView:
      type: object
      required: [agreedSellerEntitlementAmount, proposedByRole, proposedAt]
      additionalProperties: false
      properties:
        agreedSellerEntitlementAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
        proposedByRole: {enum: [BUYER, SELLER]}
        proposedAt: {type: string, format: date-time}
    MilestoneSellerDeclarationView:
      type: object
      required: [declarationNumber, sellerDeclaredWeight, sellerEvidenceFileId, deliveryCertificateFileId, declaredAt, correctionWindowClosesAt]
      additionalProperties: false
      description: The declaration in force (the latest one, D75).
      properties:
        declarationNumber: {type: integer, minimum: 1}
        sellerDeclaredWeight: {type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001}
        sellerEvidenceFileId: {type: string, format: uuid}
        deliveryCertificateFileId: {type: [string, 'null'], format: uuid}
        declaredAt: {type: string, format: date-time, description: Time of this declaration.}
        correctionWindowClosesAt: {type: string, format: date-time, description: "First declaration + the correction window (D75); a correction never moves it. Correction is also closed once buyerReceipt exists."}
    MilestoneBuyerReceiptView:
      type: object
      required: [buyerReceivedWeight, buyerEvidenceFileId, deliveryCertificateFileId, receivedAt, confirmWindowClosesAt]
      additionalProperties: false
      properties:
        buyerReceivedWeight: {type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001}
        buyerEvidenceFileId: {type: string, format: uuid}
        deliveryCertificateFileId: {type: [string, 'null'], format: uuid}
        receivedAt: {type: string, format: date-time}
        confirmWindowClosesAt: {type: string, format: date-time, description: "receivedAt + buyerConfirmWindowDays business days (D76); after it the auto-confirm job may settle the milestone."}
    MilestoneFlagView:
      type: object
      required: [issueType, flaggedAt, sellerResponseWindowClosesAt, contestedAt, contestedBy]
      additionalProperties: false
      properties:
        issueType: {enum: [QUANTITY, QUALITY]}
        flaggedAt: {type: string, format: date-time}
        sellerResponseWindowClosesAt: {type: string, format: date-time, description: flaggedAt + sellerResponseWindowDays business days.}
        contestedAt: {type: [string, 'null'], format: date-time}
        contestedBy:
          oneOf: [{enum: [SELLER, SYSTEM]}, {type: 'null'}]
          description: SYSTEM when a silent QUALITY flag was contested automatically (D82).
    MilestoneEvidenceView:
      type: object
      required: [fileId, uploadedByRole, status, uploadedAt]
      additionalProperties: false
      properties:
        fileId: {type: string, format: uuid}
        uploadedByRole: {enum: [BUYER, SELLER]}
        status: {enum: [PROCESSING, READY, FAILED]}
        uploadedAt: {type: string, format: date-time}
    MilestoneSettlementView:
      type: object
      required: [path, billableQuantityKg, sellerAmount, buyerRefundAmount, settledAt]
      additionalProperties: false
      description: "Final amounts of a SETTLED milestone, computed by the server; sellerAmount + buyerRefundAmount = the milestone's locked batch amount."
      properties:
        path:
          enum: [CLEAN_CONFIRMED, CLEAN_AUTO_CONFIRMED, SELLER_SILENT_QUANTITY, INSPECTION_RESOLVED, CONCEDED, MUTUAL_SETTLEMENT]
          description: "CLEAN_*: D77 formula; SELLER_SILENT_QUANTITY: buyer weight, no tolerance (D82); INSPECTION_RESOLVED: computedResolution approved (D81/D83); CONCEDED / MUTUAL_SETTLEMENT: D57."
        billableQuantityKg: {type: [number, 'null'], minimum: 0, description: Quantity the seller is paid for; null when the path pays by amount only.}
        sellerAmount: {type: string, pattern: '^[0-9]+\.00$', maxLength: 19}
        buyerRefundAmount: {type: string, pattern: '^[0-9]+\.00$', maxLength: 19}
        settledAt: {type: string, format: date-time}
    BreachCasePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/BreachCase'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    MilestoneEvidenceAccepted:
      type: object
      required: [fileId, status]
      additionalProperties: false
      properties:
        fileId: {type: string, format: uuid}
        status: {enum: [PROCESSING, READY, FAILED], description: Scan status known to contract-service from file.ready/file.failed; PROCESSING until one arrives.}
    MilestoneFlagRequest:
      type: object
      required: [issueType, consent]
      additionalProperties: false
      properties:
        issueType: {enum: [QUANTITY, QUALITY], description: "QUANTITY disputes the weight only; QUALITY disputes quality, the inspection checks quantity and metrics (D82)."}
        consent: {$ref: '#/components/schemas/ConsentInput'}
    BuyerReceivedRequest:
      type: object
      required: [buyerReceivedWeight, buyerEvidenceFileId, consent]
      properties:
        buyerReceivedWeight: {type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001, description: Buyer-received unloaded weight in canonical kilograms (kg); D72 bounds.}
        buyerEvidenceFileId: {type: string, format: uuid}
        deliveryCertificateFileId: {type: string, format: uuid, description: Optional batch certificate used only as delivery/dispute evidence; never parsed as actual quality metrics.}
        consent: {$ref: '#/components/schemas/ConsentInput'}
      additionalProperties: false
    ContractDocumentResponse:
      type: object
      required: [documentId, contractId, documentType, templateCode, templateVersion, sourceContentHash, status]
      additionalProperties: false
      properties:
        documentId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        documentType: {enum: [DRAFT_PREVIEW, PARTIALLY_SIGNED, FINAL_SIGNED_CONTRACT, ACTIVATION_CONFIRMATION, DELIVERY_RECEIPT, INSPECTION_RECORD]}
        templateCode: {type: string, pattern: '^VN_COFFEE_[A-Z0-9_]+$', description: FINAL_SIGNED_CONTRACT uses VN_COFFEE_B2B; supporting documents use their own versioned coffee template code.}
        templateVersion: {type: string, minLength: 1}
        sourceContentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        documentFileHash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        fileId: {type: [string, 'null'], format: uuid}
        status: {enum: [PENDING, READY, FAILED]}
        generatedAt: {type: [string, 'null'], format: date-time}
        failureReason: {type: [string, 'null']}
    ForceMajeureClaimRequest:
      type: object
      required: [evidenceFileId, consent]
      additionalProperties: false
      properties:
        evidenceFileId: {type: string, format: uuid}
        consent: {$ref: '#/components/schemas/ConsentInput'}
    ForceMajeureResolveRequest:
      type: object
      required: [decision, consent]
      additionalProperties: false
      properties:
        decision: {enum: [APPROVED, REJECTED]}
        consent: {$ref: '#/components/schemas/ConsentInput'}
    AuditRecordList:
      type: array
      items:
        type: object
        required: [recordId, subjectType, subjectId, sourceType, sourceEventType, sourceEventId, causationId, correlationId, content, recordHash, createdAt]
        additionalProperties: false
        properties:
          recordId: {type: string}
          subjectType: {enum: [CONTRACT, USER_PAIR, SYSTEM]}
          subjectId: {type: string}
          sourceType: {type: string}
          sourceEventType: {type: string}
          sourceEventId: {type: string, format: uuid}
          causationId: {type: [string, 'null'], format: uuid}
          correlationId: {type: [string, 'null'], format: uuid}
          sourceHash: {type: [string, 'null']}
          content: {$ref: '#/components/schemas/AuditReconciliationContent'}
          recordHash: {type: string}
          prevHashGlobal: {type: [string, 'null']}
          prevHashSubject: {type: [string, 'null']}
          createdAt: {type: string, format: date-time}
    AuditReconciliationContent:
      type: object
      required: [contractId, milestoneId, settledAmount, seizedAmount, releaseLegs, refundLegs]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        milestoneId: {type: [string, 'null'], format: uuid}
        settledAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19}
        seizedAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19}
        sourceEventId: {type: [string, 'null'], format: uuid}
        releaseLegs: {type: array, items: {$ref: '#/components/schemas/MoneyLeg'}}
        refundLegs: {type: array, items: {$ref: '#/components/schemas/MoneyLeg'}}
    ContractAuditTrail:
      type: object
      required: [contractId, currentRecordHash, anchorStatus, records]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        currentRecordHash: {type: string, pattern: '^[a-f0-9]{64}$', description: "recordHash of the newest record of the contract."}
        anchorStatus: {enum: [NOT_ANCHORED, ANCHORED], description: "ANCHORED when an audit_anchor covers the newest record (OpenTimestamps, #256)."}
        records: {type: array, items: {$ref: '#/components/schemas/PartyAuditRecord'}}
    PartyAuditRecord:
      type: object
      required: [recordId, sourceType, sourceEventType, content, recordHash, createdAt]
      additionalProperties: false
      properties:
        recordId: {type: string, format: uuid}
        sourceType: {type: string}
        sourceEventType: {type: string}
        content: {type: object, description: "The minimised stored content (IDs, quantities, amounts, hashes; no contact data)."}
        recordHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        createdAt: {type: string, format: date-time}
    AdminContractAuditTrail:
      type: object
      required: [contractId, currentRecordHash, anchorStatus, records]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        currentRecordHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        anchorStatus: {enum: [NOT_ANCHORED, ANCHORED]}
        records: {type: array, items: {$ref: '#/components/schemas/AdminAuditRecord'}}
    AdminAuditRecord:
      type: object
      required: [recordId, globalSeq, subjectType, subjectId, sourceType, sourceEventType, sourceEventId, content, recordHash, prevHashSubject, prevHashGlobal, createdAt]
      additionalProperties: false
      properties:
        recordId: {type: string, format: uuid}
        globalSeq: {type: integer, minimum: 1}
        subjectType: {enum: [CONTRACT, USER_PAIR, SYSTEM]}
        subjectId: {type: string}
        sourceType: {type: string}
        sourceEventType: {type: string}
        sourceEventId: {type: string, format: uuid}
        content: {type: object}
        recordHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        prevHashSubject: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        prevHashGlobal: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        createdAt: {type: string, format: date-time}
    AdminAuditRecordPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      additionalProperties: false
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/AdminAuditRecord'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    AuditChainVerification:
      type: object
      required: [scope, contractId, status, checkedRecords, brokenRecordId, brokenReason, checkedAt, anchorStatus]
      additionalProperties: false
      properties:
        scope: {enum: [CONTRACT, GLOBAL]}
        contractId: {type: [string, 'null'], format: uuid, description: "null for GLOBAL."}
        status: {enum: [INTACT, BROKEN]}
        checkedRecords: {type: integer, minimum: 0}
        brokenRecordId: {type: [string, 'null'], format: uuid, description: "The first record that fails, in chain order; null when INTACT."}
        brokenReason:
          oneOf: [{enum: [RECORD_HASH_MISMATCH, SUBJECT_LINK_BROKEN, GLOBAL_LINK_BROKEN]}, {type: 'null'}]
          description: >-
            RECORD_HASH_MISMATCH = a stored field no longer gives the stored recordHash (content changed); SUBJECT_LINK_BROKEN / GLOBAL_LINK_BROKEN = the link hash does not equal the recordHash of the record before it (a record removed or inserted). null when INTACT.
        checkedAt: {type: string, format: date-time}
        anchorStatus: {enum: [NOT_ANCHORED, ANCHORED], description: "Removing the newest records is only caught against an anchor (hash-chain §4.3); NOT_ANCHORED says that limit applies."}
    AuditHashResponse:
      type: object
      required: [contractId, recordHash]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        recordHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    MoneyLeg:
      type: object
      required: [sourceEventId, entryType, fundType, remedyDecisionId, remedyLegId, amount]
      additionalProperties: false
      properties:
        entryType: {enum: [RELEASE_TO_SELLER, REFUND_TO_BUYER, DEPOSIT_FORFEITURE, CONTRACTUAL_PENALTY, DAMAGES_COMPENSATION]}
        fundType: {enum: [BUYER_DEPOSIT, SELLER_DEPOSIT, MILESTONE_PAYMENT]}
        remedyDecisionId: {type: [string, 'null'], format: uuid}
        remedyLegId: {type: [string, 'null'], format: uuid}
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19}
        sourceEventId: {type: string, format: uuid}
    LedgerEntryList:
      type: array
      items:
        type: object
        required: [entryId, sourceEventId, contractId, milestoneId, userId, entryType, fundType, remedyDecisionId, remedyLegId, amount, createdAt]
        additionalProperties: false
        properties:
          entryId: {type: string, format: uuid}
          sourceEventId: {type: string, format: uuid}
          contractId: {type: string, format: uuid}
          milestoneId: {type: [string, 'null'], format: uuid}
          userId: {type: string, format: uuid}
          entryType: {enum: [LOCK_BUYER_DEPOSIT, LOCK_SELLER_DEPOSIT, LOCK_MILESTONE, RELEASE_TO_SELLER, REFUND_TO_BUYER, DEPOSIT_FORFEITURE, CONTRACTUAL_PENALTY, DAMAGES_COMPENSATION]}
          fundType: {enum: [BUYER_DEPOSIT, SELLER_DEPOSIT, MILESTONE_PAYMENT]}
          remedyDecisionId: {type: [string, 'null'], format: uuid}
          remedyLegId: {type: [string, 'null'], format: uuid}
          amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 19}
          createdAt: {type: string, format: date-time}
    ExternalVerifierRequest:
      type: object
      required: [keyId, signedPayload, signature]
      additionalProperties: false
      properties:
        keyId: {type: string, minLength: 1}
        signedPayload:
          type: object
          required: [action, reason, timestamp, nonce]
          additionalProperties: false
          properties:
            action: {enum: [LOCK, UNLOCK]}
            reason: {type: string, minLength: 1}
            timestamp: {type: string, format: date-time}
            nonce: {type: string, format: uuid}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
    ErrorEnvelope:
      type: object
      required: [timestamp, status, error, code, message, path, traceId]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, minimum: 100, maximum: 599}
        error: {type: string}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
        message: {type: string}
        path: {type: string}
        traceId: {type: string}
      additionalProperties: false
  responses:
    BadRequest: {description: Validation failure, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Unauthorized: {description: Authentication or API-key failure, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Forbidden: {description: Authorization or ownership failure, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Conflict: {description: "State/terms/challenge/inventory conflict, including INSUFFICIENT_LISTING_QUANTITY and LISTING_VERSION_MISMATCH where applicable", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    ExternalSignatureInvalid:
      description: ES256 verification, key lookup, or timestamp validation failed. Code is EXTERNAL_SIGNATURE_INVALID, EXTERNAL_KEY_UNKNOWN, or SIGNATURE_TIMESTAMP_OUT_OF_WINDOW.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    SystemAlreadyLocked:
      description: Code is NONCE_REPLAYED or SYSTEM_ALREADY_LOCKED.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    SystemNotLocked:
      description: Code is NONCE_REPLAYED or SYSTEM_NOT_LOCKED.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Stable command identifier reused for caller retries.
x-closed-contract-questions: [OQ-02, OQ-02b, OQ-03, OC-01, OC-05, OC-09, OC-10, OC-11]
x-reference-only:
  description: >-
    Reference-only paths are retained for cross-service context and are not part of
    the first executable golden-flow release gate. Their owner designs remain the
    source for future DTO/status promotion; they must not be implemented from this
    document by inference.
  paths:
    - /api/v1/users/register
    - /api/v1/users/me/email-verification
    - /api/v1/users/me/email-verification/confirm
    - /api/v1/users/me
    - /api/v1/users/{userId}
    - /api/v1/admin/users
    - /api/v1/admin/users/{userId}
    - /api/v1/admin/users/{userId}/verify
    - /api/v1/admin/users/{userId}/reject
    - /api/v1/admin/users/{userId}/role
