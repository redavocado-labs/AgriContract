      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      responses: {'2XX': {description: KYC profile; exact response wire shape is not frozen.}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v1/admin/users/{userId}/verify:
    x-service-owner: user-service
    post:
      operationId: verifyUser
      x-roles: [OPERATOR]
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyUserRequest'}}}}
      responses: {'2XX': {description: Verified; exact success status is not frozen.}, '400': {$ref: '#/components/responses/BadRequest'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/admin/users/{userId}/reject:
