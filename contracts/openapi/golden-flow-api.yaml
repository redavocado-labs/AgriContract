    post:
      operationId: rejectUser
      x-roles: [OPERATOR]
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RejectUserRequest'}}}}
      responses: {'2XX': {description: Rejected; exact success status is not frozen.}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/admin/users/{userId}/role:
    x-service-owner: user-service
    put:
      operationId: assignUserRole
      x-roles: [ADMIN]
      description: >-
        ADMIN-only account role management (data-governance design 5.2/5.4). One role per
        account. A direct OPERATOR to ARBITRATOR change, or the reverse, is rejected with
        409 ROLE_SEPARATION_VIOLATION so one person cannot propose and then approve the same
